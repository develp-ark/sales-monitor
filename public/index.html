async function exportXlsx() {
  var btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳ 데이터 로딩...';
  try {
    var res = await fetch('/api/export');
    var data = await res.json();
    if (!data.ok) { alert('오류: ' + (data.error || 'unknown')); return; }

    var today = new Date();
    var curYear = today.getFullYear();
    var curMonth = today.getMonth();
    var prevMonth = curMonth === 0 ? 11 : curMonth - 1;
    var prevYear = curMonth === 0 ? curYear - 1 : curYear;
    var prev2Month = prevMonth === 0 ? 11 : prevMonth - 1;
    var prev2Year = prevMonth === 0 ? prevYear - 1 : prevYear;

    btn.textContent = '⏳ xlsx 생성 중...';

    var wb = new ExcelJS.Workbook();
    var brands = data.brands || [];

    // 브랜드 컬러
    var brandColors = {
      '아리코': { header: '3B82F6', light: 'EBF3FF' },
      '윰': { header: '10B981', light: 'E8FFF5' },
      '건우코리아': { header: 'EF4444', light: 'FFF0EE' }
    };

    brands.forEach(function(brand) {
      var brandRows = data.rows.filter(function(r) { return r.brand === brand; });
      if (!brandRows.length) return;

      var bc = brandColors[brand] || { header: '4472C4', light: 'D6E4F0' };

      // SKU별 데이터 정리
      var skuMap = {};
      var allDates = {};
      brandRows.forEach(function(r) {
        if (!skuMap[r.sku_id]) {
          skuMap[r.sku_id] = { name: r.sku_name, stock: r.stock, status: r.status, dates: {} };
        }
        skuMap[r.sku_id].dates[r.date] = Number(r.sales) || 0;
        skuMap[r.sku_id].stock = r.stock;
        skuMap[r.sku_id].status = r.status;
        allDates[r.date] = true;
      });

      var datesSorted = Object.keys(allDates).sort();

      // 월별 그룹핑
      var monthMap = {};
      datesSorted.forEach(function(d) {
        var key = d.substring(0, 7);
        if (!monthMap[key]) monthMap[key] = [];
        monthMap[key].push(d);
      });
      var months = Object.keys(monthMap).sort();

      // === 월별 아카이브 데이터 병합 ===
      var monthlyArchive = {};
      if (data.monthly && data.monthly.length) {
        data.monthly.forEach(function(mr) {
          if (mr.brand !== brand) return;
          if (!monthlyArchive[mr.sku_id]) monthlyArchive[mr.sku_id] = {};
          monthlyArchive[mr.sku_id][mr.month] = Number(mr.sales) || 0;
          // SKU 정보가 없으면 추가
          if (!skuMap[mr.sku_id]) {
            skuMap[mr.sku_id] = { name: mr.sku_name || '', stock: '', status: '', dates: {} };
          }
        });
      }

      // 아카이브에만 있는 월을 months에 추가
      var archiveMonths = {};
      Object.keys(monthlyArchive).forEach(function(sid) {
        Object.keys(monthlyArchive[sid]).forEach(function(m) {
          archiveMonths[m] = true;
        });
      });
      Object.keys(archiveMonths).forEach(function(m) {
        if (months.indexOf(m) === -1) {
          months.push(m);
        }
      });
      months.sort();

      // === 컬럼 구성 (연도별 합계 포함) ===
      var headerRow = ['SKU ID', 'SKU명', '재고', '상태'];
      var colInfo = [];

      var yearMap = {};
      months.forEach(function(m) {
        var y = m.substring(0, 4);
        if (!yearMap[y]) yearMap[y] = [];
        yearMap[y].push(m);
      });
      var years = Object.keys(yearMap).sort();

      years.forEach(function(y) {
        var yr = parseInt(y, 10);
        var isThisYear = (yr === curYear);
        var isLastYear = (yr === curYear - 1);
        var recentYear = isThisYear || isLastYear;

        headerRow.push(y + '년 합계');
        colInfo.push({ type: 'yearSum', year: y, outline: 0 });

        yearMap[y].forEach(function(m) {
          var mParts = m.split('-');
          var mYear = parseInt(mParts[0], 10);
          var mMonth = parseInt(mParts[1], 10) - 1;
          var isCurrent = (mYear === curYear && mMonth === curMonth);
          var isPrev = (mYear === prevYear && mMonth === prevMonth);
          var isPrev2 = (mYear === prev2Year && mMonth === prev2Month);

          headerRow.push(m + ' 합계');
          colInfo.push({
            type: 'sum', month: m, year: y,
            outline: recentYear ? 0 : 1,
            hidden: !recentYear
          });

          if (isCurrent || isPrev || isPrev2) {
            var dailyDates = monthMap[m] || [];
            dailyDates.forEach(function(d) {
              headerRow.push(d.substring(5));
              colInfo.push({
                type: 'daily', date: d, month: m, year: y,
                outline: isPrev2 ? 2 : (recentYear ? 0 : 1),
                hidden: isPrev2 || !recentYear
              });
            });
          }
        });
      });

      // SKU 정렬
      var skuIds = Object.keys(skuMap).sort(function(a, b) {
        return (skuMap[a].name || '').localeCompare(skuMap[b].name || '');
      });

      // 시트 생성
      var ws = wb.addWorksheet(brand, {
        views: [{ state: 'frozen', xSplit: 4, ySplit: 2 }]
      });

      // 1행: 헤더 — 월합계·연합계 검정, 일별(SEQ) 및 고정열은 브랜드 컬러
      var HEADER_AGG = 'FF1A1A1A'; /* 월합계(sum) · 연합계(yearSum) */
      var hRow = ws.addRow(headerRow);
      hRow.height = 20;
      hRow.eachCell(function(cell, colNum) {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 9 };
        cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        cell.border = {
          bottom: { style: 'thin', color: { argb: 'FFD0D0D0' } }
        };
        var fg = 'FF' + bc.header;
        if (colNum <= 4) {
          fg = 'FF' + bc.header;
        } else {
          var hci = colNum - 5;
          var hin = colInfo[hci];
          if (hin && hin.type === 'daily') fg = 'FF' + bc.header;
          else if (hin && (hin.type === 'sum' || hin.type === 'yearSum')) fg = HEADER_AGG;
          else fg = 'FF' + bc.header;
        }
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fg } };
      });

      // 2행: 합계
      var sumValues = ['합계', '', '', ''];
      // 나중에 채움
      colInfo.forEach(function() { sumValues.push(0); });

      // 데이터 행 먼저 계산
      var dataRowArrays = [];
      skuIds.forEach(function(sid) {
        var sku = skuMap[sid];
        var row = [sid, sku.name, sku.stock, sku.status];
        colInfo.forEach(function(col) {
          if (col.type === 'yearSum') {
            var ySum = 0;
            yearMap[col.year].forEach(function(m) {
              if (monthMap[m]) {
                monthMap[m].forEach(function(d) { ySum += (sku.dates[d] || 0); });
              }
              if (monthlyArchive[sid] && monthlyArchive[sid][m]) {
                var dailySum = 0;
                if (monthMap[m]) monthMap[m].forEach(function(d) { dailySum += (sku.dates[d] || 0); });
                if (dailySum === 0) ySum += monthlyArchive[sid][m];
              }
            });
            row.push(ySum);
          } else if (col.type === 'sum') {
            var sum = 0;
            // 일별 데이터에서 합산
            if (monthMap[col.month]) {
              monthMap[col.month].forEach(function(d) { sum += (sku.dates[d] || 0); });
            }
            // 일별 데이터가 없고 아카이브가 있으면 아카이브 사용
            if (sum === 0 && monthlyArchive[sid] && monthlyArchive[sid][col.month]) {
              sum = monthlyArchive[sid][col.month];
            }
            row.push(sum);
          } else {
            row.push(sku.dates[col.date] || 0);
          }
        });
        dataRowArrays.push(row);
      });

      // 합계 계산
      colInfo.forEach(function(col, ci) {
        var s = 0;
        dataRowArrays.forEach(function(dr) { s += (Number(dr[ci + 4]) || 0); });
        sumValues[ci + 4] = s;
      });

      var sRow = ws.addRow(sumValues);
      sRow.height = 20;
      sRow.eachCell(function(cell, colNum) {
        cell.font = { bold: true, size: 9 };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF2CC' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        if (colNum > 4 && cell.value > 0) {
          cell.numFmt = '#,##0';
        }
      });

      // 데이터 행
      dataRowArrays.forEach(function(rowData) {
        var r = ws.addRow(rowData);
        r.eachCell(function(cell, colNum) {
          cell.font = { size: 9 };
          cell.alignment = { horizontal: colNum <= 2 ? 'left' : 'center', vertical: 'middle' };

          if (colNum > 4) {
            var val = cell.value;
            if (val === 0 || val === null || val === undefined) {
              cell.value = 0;
              cell.numFmt = '"-"';
              cell.font = { size: 9, color: { argb: 'FFD0D0D0' } };
            } else {
              // 판매값 있는 셀 컬러링
              var ci = colNum - 5;
              if (colInfo[ci] && colInfo[ci].type === 'sum') {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + bc.light } };
                cell.font = { size: 9, bold: true };
                cell.numFmt = '#,##0';
              } else {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF8E1' } };
                cell.numFmt = '#,##0';
              }
            }
          }
        });
      });

      // 열 너비 & 아웃라인
      ws.getColumn(1).width = 14;
      ws.getColumn(2).width = 50;
      ws.getColumn(3).width = 8;
      ws.getColumn(4).width = 10;
      for (var c = 5; c <= 4 + colInfo.length; c++) {
        var ci = c - 5;
        var col = colInfo[ci];
        ws.getColumn(c).width = 5;
        if (col.outline) ws.getColumn(c).outlineLevel = col.outline;
        if (col.hidden) ws.getColumn(c).hidden = true;
      }

      // 자동 필터 (2행부터)
      ws.autoFilter = {
        from: { row: 2, column: 1 },
        to: { row: ws.rowCount, column: headerRow.length }
      };
    });

    // ===== Daily Trend 시트 =====
    var trendRows = data.dailyTrend || [];
    if (trendRows.length > 0) {
      var wsTrend = wb.addWorksheet('Daily Trend', {
        views: [{ state: 'frozen', xSplit: 2, ySplit: 2 }]
      });

      var trendByBrand = {};
      var trendDates = {};
      trendRows.forEach(function(r) {
        if (!trendByBrand[r.brand]) trendByBrand[r.brand] = {};
        trendByBrand[r.brand][r.date] = Number(r.s) || 0;
        trendDates[r.date] = true;
      });

      var trendDatesSorted = Object.keys(trendDates).sort();
      var trendBrands = brands.filter(function(b) { return trendByBrand[b]; });

      var trendMonthMap = {};
      trendDatesSorted.forEach(function(d) {
        var key = d.substring(0, 7);
        if (!trendMonthMap[key]) trendMonthMap[key] = [];
        trendMonthMap[key].push(d);
      });
      var trendMonths = Object.keys(trendMonthMap).sort();

      var tHeader = ['날짜', '요일'].concat(trendBrands).concat(['합계']);
      var thRow = wsTrend.addRow(tHeader);
      thRow.eachCell(function(cell, colNum) {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 9 };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF333333' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        if (colNum > 2 && colNum <= 2 + trendBrands.length) {
          var bName = trendBrands[colNum - 3];
          var bc = brandColors[bName] || { header: '4472C4' };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + bc.header } };
        }
      });

      var tSumRow = ['합계', ''];
      trendBrands.forEach(function(b) {
        var s = 0;
        trendDatesSorted.forEach(function(d) { s += (trendByBrand[b][d] || 0); });
        tSumRow.push(s);
      });
      var grandTotal = 0;
      trendDatesSorted.forEach(function(d) {
        trendBrands.forEach(function(b) { grandTotal += (trendByBrand[b][d] || 0); });
      });
      tSumRow.push(grandTotal);

      var tsRow = wsTrend.addRow(tSumRow);
      tsRow.eachCell(function(cell, colNum) {
        cell.font = { bold: true, size: 9 };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF2CC' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        if (colNum > 2) cell.numFmt = '#,##0';
      });

      var dayNames = ['일', '월', '화', '수', '목', '금', '토'];

      for (var mi = trendMonths.length - 1; mi >= 0; mi--) {
        var mon = trendMonths[mi];
        var mDates = trendMonthMap[mon];

        var mSumRow = [mon + ' 합계', ''];
        var mGrandTotal = 0;
        trendBrands.forEach(function(b) {
          var s = 0;
          mDates.forEach(function(d) { s += (trendByBrand[b][d] || 0); });
          mSumRow.push(s);
          mGrandTotal += s;
        });
        mSumRow.push(mGrandTotal);

        var msRow = wsTrend.addRow(mSumRow);
        msRow.eachCell(function(cell, colNum) {
          cell.font = { bold: true, size: 9 };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E2F3' } };
          cell.alignment = { horizontal: 'center', vertical: 'middle' };
          if (colNum > 2) cell.numFmt = '#,##0';
        });

        var mParts = mon.split('-');
        var mYear = parseInt(mParts[0]);
        var mMonth = parseInt(mParts[1]) - 1;
        var isCurrent = (mYear === curYear && mMonth === curMonth);
        var isPrev = (mYear === prevYear && mMonth === prevMonth);
        var isPrev2 = (mYear === prev2Year && mMonth === prev2Month);

        if (isCurrent || isPrev || isPrev2) {
          for (var di = mDates.length - 1; di >= 0; di--) {
            var d = mDates[di];
            var dt = new Date(d + 'T12:00:00Z');
            var dow = dayNames[dt.getUTCDay()];
            var row = [d.substring(5), dow];
            var dayTotal = 0;
            trendBrands.forEach(function(b) {
              var v = trendByBrand[b][d] || 0;
              row.push(v);
              dayTotal += v;
            });
            row.push(dayTotal);

            var dRow = wsTrend.addRow(row);
            var isWeekend = (dt.getUTCDay() === 0 || dt.getUTCDay() === 6);
            dRow.eachCell(function(cell, colNum) {
              cell.font = { size: 9 };
              cell.alignment = { horizontal: 'center', vertical: 'middle' };
              if (colNum > 2) {
                var val = cell.value;
                if (val === 0) {
                  cell.numFmt = '"-"';
                  cell.font = { size: 9, color: { argb: 'FFD0D0D0' } };
                } else {
                  cell.numFmt = '#,##0';
                  cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF8E1' } };
                }
              }
              if (isWeekend) {
                cell.font = { size: 9, color: { argb: 'FFFF6B6B' } };
              }
            });

            if (isPrev2) {
              dRow.outlineLevel = 1;
              dRow.hidden = true;
            }
          }
        }
      }

      wsTrend.getColumn(1).width = 12;
      wsTrend.getColumn(2).width = 6;
      for (var tc = 3; tc <= 2 + trendBrands.length + 1; tc++) {
        wsTrend.getColumn(tc).width = 12;
      }

      wsTrend.autoFilter = {
        from: { row: 2, column: 1 },
        to: { row: wsTrend.rowCount, column: tHeader.length }
      };
    }

    // 다운로드
    btn.textContent = '⏳ 파일 저장 중...';
    var buffer = await wb.xlsx.writeBuffer();
    var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var fileName = '판매데이터_' + curYear + (curMonth + 1 < 10 ? '0' : '') + (curMonth + 1) + (today.getDate() < 10 ? '0' : '') + today.getDate() + '.xlsx';
    saveAs(blob, fileName);

  } catch (e) {
    alert('다운로드 오류: ' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = '📥 데이터 다운로드';
  }
}
</script>

</body>
</html>

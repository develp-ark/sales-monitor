<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;background:#f5f6fa;color:#333;font-size:14px;line-height:1.6}

.header{background:linear-gradient(135deg,#1a73e8 0%,#4285f4 100%);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(26,115,232,.3)}
.header h1{font-size:18px;color:#fff;font-weight:700;letter-spacing:-0.3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.header .header-ver{font-size:12px;font-weight:700;color:rgba(255,255,255,.95);background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;letter-spacing:0}
.header .sub{font-size:12px;color:rgba(255,255,255,.8)}
.site-footer{margin-top:28px;padding:18px 8px 32px;text-align:center;font-size:12px;color:#8B95A1;line-height:1.6;border-top:1px solid #EEF1F5}
.wrap{max-width:1280px;margin:0 auto;padding:16px}

.action{background:#fff;border-radius:12px;padding:12px 18px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8eaed}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-blue{background:#1a73e8;color:#fff;box-shadow:0 1px 3px rgba(26,115,232,.3)}
.btn-blue:hover{background:#1557b0;box-shadow:0 2px 6px rgba(26,115,232,.4);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#1a73e8;border:1.5px solid #dadce0}
.btn-ghost:hover{background:#e8f0fe;border-color:#1a73e8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:11px;color:#9aa0a6;margin-left:auto}

.log{background:#202124;color:#8ab4f8;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-family:'Fira Code',Consolas,monospace;font-size:11px;max-height:140px;overflow-y:auto;display:none;white-space:pre-wrap;border:1px solid #3c4043}
.log.show{display:block}

.main-tabs{display:flex;gap:0;background:#fff;border-radius:12px 12px 0 0;border-bottom:2px solid #e8eaed;overflow-x:auto}
.main-tab{padding:12px 28px;font-size:14px;font-weight:600;color:#5f6368;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.main-tab:hover{color:#1a73e8;background:#f8f9ff}
.main-tab.active{color:#1a73e8;border-bottom-color:#1a73e8;background:#f8f9ff}
.main-panel{display:none;background:#fff;border-radius:0 0 12px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8eaed;border-top:none}
.main-panel.active{display:block}

/* ===== Toss-style Brand Cards v2 ===== */
.dash-inner{padding:24px}
.dash-grid{display:flex;flex-direction:column;gap:14px;padding:0 16px 24px}
@media(min-width:768px){
  .dash-grid{flex-direction:row;flex-wrap:wrap}
  .brand-tile{flex:1;min-width:280px;max-width:calc(33.333% - 10px)}
}

.brand-tile{
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  transition:transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;
}
.brand-tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}

.bt-hero{
  padding:22px 22px 18px;position:relative;overflow:hidden;
}

.bt-hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative;z-index:1}
.bt-hero-top h3{font-size:15px;font-weight:700;margin:0;color:#191F28;display:flex;align-items:center;gap:8px}
.brand-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.brand-actions{display:flex;gap:5px}
.brand-actions a{
  display:flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:10px;
  text-decoration:none;font-size:13px;
  transition:background .15s;position:relative;
}
.brand-actions a.act-sheet{background:rgba(49,130,246,.1);color:#3182F6}
.brand-actions a.act-sheet:hover{background:rgba(49,130,246,.2)}
.brand-actions a.act-insight{background:rgba(124,92,252,.1);color:#7C5CFC}
.brand-actions a.act-insight:hover{background:rgba(124,92,252,.2)}

.bt-big{position:relative;z-index:1}
.bt-big-label{font-size:12px;color:#8B95A1;font-weight:500;margin-bottom:4px}
.bt-big-val{font-size:32px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}

.bt-duo{display:flex;gap:0;border-top:1px solid #F2F4F6;position:relative;z-index:1}
.bt-duo-item{flex:1;padding:14px 22px;display:flex;flex-direction:column;gap:2px}
.bt-duo-item+.bt-duo-item{border-left:1px solid #F2F4F6}
.bt-duo-label{font-size:11px;color:#8B95A1;font-weight:500}
.bt-duo-val{font-size:18px;font-weight:700;color:#191F28;font-variant-numeric:tabular-nums}

.bt-badges{display:flex;gap:0;border-top:1px solid #F2F4F6}
.bt-badge{flex:1;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.bt-badge+.bt-badge{border-left:1px solid #F2F4F6}
.bt-badge-label{font-size:10px;color:#8B95A1;font-weight:500}
.bt-badge-val{font-size:14px;font-weight:700;color:#333;font-variant-numeric:tabular-nums}
.bt-badge-val.red{color:#F04452}

.stitle{font-size:15px;font-weight:700;color:#202124;margin:24px 0 10px;padding-left:12px;border-left:4px solid #1a73e8}
.trend-wrap{overflow-x:auto;border-radius:10px;border:1px solid #e8eaed}
table.trend{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.trend th,table.trend td{padding:7px 10px;text-align:right;border-bottom:1px solid #f1f3f4}
table.trend th{background:#f8f9fa;color:#5f6368;font-weight:600;position:sticky;top:0;z-index:2;white-space:nowrap;font-size:11px}
table.trend th:first-child,table.trend td:first-child{text-align:left}
table.trend td:first-child{font-weight:600;color:#202124}
table.trend tr:hover{background:#f8faff}
table.trend .wk{background:#e8f0fe;font-weight:700}
table.trend .tot{background:#fff8e1;font-weight:700}

.insight-inner{padding:0}
.brand-tabs{display:flex;gap:0;background:#f8f9fa;border-bottom:1px solid #e8eaed;overflow-x:auto;padding:0 8px}
.brand-tab{padding:12px 24px;font-size:13px;font-weight:600;color:#5f6368;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.brand-tab:hover{color:#1a73e8}
.brand-tab.active{color:#1a73e8;border-bottom-color:#1a73e8;background:#fff}
.brand-content{display:none;padding:24px}
.brand-content.active{display:block}

.brand-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.brand-hdr h2{font-size:17px;font-weight:700;color:#202124}

.summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.scard{background:linear-gradient(135deg,#f8f9ff 0%,#fff 100%);border-radius:10px;padding:12px;text-align:center;border:1px solid #e8eaed;transition:all .2s}
.scard:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.scard .sl{font-size:11px;color:#5f6368;margin-bottom:4px;font-weight:500}
.scard .sv{font-size:18px;font-weight:700;color:#202124}
.scard .sv.blue{color:#1a73e8}
.scard .sv.red{color:#ea4335}
.scard .sv.green{color:#34a853}

.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-group label{font-size:11px;color:#5f6368;font-weight:600;white-space:nowrap}
.ctrl-val{font-size:12px;font-weight:700;color:#1a73e8;min-width:32px;text-align:center}
.ctrl-sep{width:1px;height:24px;background:#dadce0}

.flag-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.flag-bar span{font-size:12px;color:#5f6368;margin-right:4px}
.flag-chip{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #dadce0;background:#fff;color:#5f6368;transition:all .2s}
.flag-chip:hover{border-color:#1a73e8;color:#1a73e8;background:#e8f0fe}
.flag-chip.active{background:#1a73e8;color:#fff;border-color:#1a73e8;box-shadow:0 1px 4px rgba(26,115,232,.3)}

.i-grid{display:grid;grid-template-columns:1fr;gap:14px}
.i-box{border:1px solid #e8eaed;border-radius:12px;overflow:hidden;background:#fff;transition:box-shadow .2s}
.i-box:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.i-title{padding:12px 16px;font-size:13px;font-weight:700;border-bottom:1px solid #f1f3f4;display:flex;align-items:center;gap:6px}
.i-title.t-top{color:#1a73e8;background:linear-gradient(90deg,#f0f6ff,#fff);border-left:4px solid #1a73e8}
.i-title.t-out{color:#ea4335;background:linear-gradient(90deg,#fef7f6,#fff);border-left:4px solid #ea4335}
.i-title.t-up{color:#34a853;background:linear-gradient(90deg,#f2faf4,#fff);border-left:4px solid #34a853}
.i-title.t-down{color:#e67e22;background:linear-gradient(90deg,#fef9f3,#fff);border-left:4px solid #e67e22}

.i-list{list-style:none;max-height:340px;overflow-y:auto}
.i-list li{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid #f8f9fa;font-size:12px;gap:8px;transition:background .1s;cursor:pointer}
.i-list li:last-child{border:none}
.i-list li:hover{background:#f8faff}
.rk{width:24px;height:24px;border-radius:50%;background:#f1f3f4;color:#5f6368;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rk.g1{background:#1a73e8;color:#fff}
.rk.g2{background:#4285f4;color:#fff}
.rk.g3{background:#8ab4f8;color:#fff}
.sn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#202124}
.sv2{font-weight:700;white-space:nowrap;font-size:12px}
.sv2.blue{color:#1a73e8}
.sv2.red{color:#ea4335}
.sv2.green{color:#34a853}
.sv2.orange{color:#e67e22}
.tag{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag-out{background:#fce8e6;color:#ea4335}
.tag-num{background:#e8f0fe;color:#1a73e8}
.tag-stk{background:#f1f3f4;color:#5f6368}
.tag-since{background:#fff3cd;color:#856404}
.oos-since{font-size:11px;color:#9aa0a6;white-space:nowrap}
.tag-flag{background:#e6f4ea;color:#137333;border:1px solid #ceead6}
.empty{padding:24px;text-align:center;color:#9aa0a6;font-size:13px}

.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;width:400px;max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal h3{font-size:16px;margin-bottom:14px;color:#202124;font-weight:700}
.modal .sku-info{font-size:12px;color:#5f6368;margin-bottom:16px;word-break:break-all;background:#f8f9fa;padding:8px 12px;border-radius:8px}
.modal label{font-size:12px;font-weight:600;color:#5f6368;display:block;margin-bottom:4px}
.modal select,.modal input{width:100%;padding:10px 12px;border:1px solid #dadce0;border-radius:8px;font-size:13px;margin-bottom:14px;transition:border-color .2s}
.modal select:focus,.modal input:focus{border-color:#1a73e8;outline:none;box-shadow:0 0 0 2px rgba(26,115,232,.15)}
.modal .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

@media(max-width:600px){
  .wrap{padding:10px}
  .brand-grid{grid-template-columns:1fr}
  .summary-row{grid-template-columns:repeat(3,1fr)}
  .i-grid{grid-template-columns:1fr}
  .ctrl-panel{gap:10px}
}

/* 커스텀 슬라이더 */
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#e8eaed;outline:none;transition:background .2s}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ctrl-panel{background:#fff;border:1px solid #e8eaed;border-radius:12px;padding:14px 20px;margin-bottom:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ctrl-group select{padding:5px 10px;border:1.5px solid #dadce0;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;transition:all .2s}
.ctrl-group select:focus{border-color:#1a73e8;outline:none;box-shadow:0 0 0 2px rgba(26,115,232,.15)}
.ctrl-val{font-size:13px;font-weight:700;min-width:36px;text-align:center;padding:5px 10px;border-radius:10px;background:#F2F4F6;color:#191F28}

/* Toss-style 인사이트 컨트롤 패널 */
.ctrl-panel-toss{
  flex-direction:column;
  align-items:stretch;
  gap:20px;
  padding:22px 24px;
  margin:12px 0 20px;
  border:none;
  border-radius:20px;
  background:#fff;
  box-shadow:0 4px 24px rgba(0,23,51,.06),0 1px 2px rgba(0,23,51,.04);
}
.ctrl-panel-split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  align-items:stretch;
}
@media(max-width:900px){
  .ctrl-panel-split{grid-template-columns:1fr}
}
.period-card{
  padding:18px 18px 16px;
  border-radius:16px;
  background:#F9FAFB;
  border:1px solid #EEF1F5;
}
.period-card--aggregate{border-left:4px solid #3182F6}
.period-card--compare{border-left:4px solid #F04452}
.period-card__ttl{
  font-size:14px;font-weight:700;color:#191F28;letter-spacing:-.02em;margin:0 0 14px;
}
.period-card__ttl span{display:block;font-size:11px;font-weight:600;color:#8B95A1;margin-top:4px}
.period-card__dates{
  display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;
}
.period-field{
  flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px;
}
.period-field label{
  font-size:12px;font-weight:600;color:#8B95A1;
}
.period-field input[type=date]{
  width:100%;font-size:14px;font-weight:500;color:#191F28;
  padding:11px 14px;border-radius:14px;border:1px solid #E5E8EB;
  background:#fff;
  transition:border-color .15s, box-shadow .15s;
}
.period-field input[type=date]:focus{
  outline:none;border-color:#3182F6;box-shadow:0 0 0 3px rgba(49,130,246,.12);
}
.period-card__hint{
  font-size:11px;font-weight:600;color:#B0B8C1;margin:2px 0 10px;letter-spacing:-.01em;
}
.seg-wrap{
  display:flex;flex-wrap:wrap;gap:8px;background:#EFF1F6;padding:8px;border-radius:16px;
}
.period-card--compare .seg-wrap{margin-bottom:10px}
.seg-btn{
  flex:1;min-width:52px;padding:11px 8px;border:none;border-radius:12px;
  font-size:13px;font-weight:700;color:#8B95A1;background:transparent;
  cursor:pointer;font-variant-numeric:tabular-nums;
  transition:background .15s,color .15s,transform .12s;
}
.seg-btn:hover{color:#3182F6;background:rgba(255,255,255,.75)}
.seg-btn:active{transform:scale(.97)}
.seg-btn--on{color:#3182F6;background:#fff;box-shadow:0 2px 8px rgba(49,130,246,.12)}
.period-card--compare .seg-btn:hover{color:#F04452}
.period-card--compare .seg-btn--on{color:#F04452;background:#fff;box-shadow:0 2px 8px rgba(240,68,82,.12)}
.sync-prev-btn{
  width:100%;margin-bottom:10px;padding:13px 16px;border-radius:14px;border:1.5px dashed #E5E8EB;
  background:#fff;font-size:13px;font-weight:700;color:#191F28;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.sync-prev-btn:hover{border-color:#F04452;color:#F04452;background:#FFF8F8}

.slider-stack{
  display:flex;flex-wrap:wrap;gap:16px 28px;padding-top:4px;border-top:1px solid #F2F4F6;margin-top:2px;padding-top:18px;
}
.slider-chip{
  display:flex;align-items:center;gap:12px;flex:1;min-width:200px;
}
.slider-chip label{
  flex:0 0 auto;font-size:13px;font-weight:700;color:#191F28;white-space:nowrap;width:52px;
}
.slider-chip--wide-label label{width:auto;min-width:5.5em}
.slider-chip input[type=range]{
  flex:1;min-width:96px;height:10px;border-radius:999px;background:#E5E8EB;
}
.slider-chip .ctrl-val{
  flex:0 0 auto;min-width:54px;background:#EFF1F6;color:#3182F6;font-size:13px;font-weight:800;padding:8px 12px;border-radius:12px;
}
.ctrl-panel-toss .slider-chip .ctrl-val{color:var(--accent,#3182F6);background:rgba(0,0,0,.04)}
.ctrl-panel-toss input[type=range]{accent-color:var(--accent,#3182F6)}
.ctrl-panel-toss input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;cursor:pointer;
  background:var(--accent,#3182F6);border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,23,51,.14);transition:transform .15s;
}
.ctrl-panel-toss input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.08)}
.ctrl-panel-toss input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;cursor:pointer;border:3px solid #fff;
  background:var(--accent,#3182F6);box-shadow:0 2px 8px rgba(0,23,51,.14);
}
.period-card--compare .period-field input[type=date]:focus{
  border-color:#F87171;box-shadow:0 0 0 3px rgba(248,113,113,.14);
}
.insight-status{display:none;margin:6px 0 10px;padding:8px 12px;border:1px solid #DCEBFF;background:#F5F9FF;border-radius:8px;font-size:12px;color:#2563EB;font-weight:600}
.insight-status.show{display:block}
.i-grid.loading{opacity:.55;pointer-events:none;filter:grayscale(15%)}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
<div id="loadingOverlay" style="
  display:flex; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(255,255,255,0.85); z-index:9999;
  justify-content:center; align-items:center; flex-direction:column;">
  <div style="width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #0984e3;
    border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  <p style="margin-top:16px;color:#555;font-size:14px;">대시보드 로딩 중...</p>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<div class="header">
  <h1><span>📊 통합 판매 모니터링</span><span class="header-ver">ver.2</span></h1>
  <span class="sub" id="dateD"></span>
</div>

<div class="wrap">
  <!-- Upload buttons -->
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-blue" onclick="document.getElementById('anyFile').click()">파일 업로드</button>
    <button class="btn" onclick="loadAll(true)"
      style="background:#fff;color:#6B7684;border:1px solid #E5E8EB;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer">
      ↻ 새로고침
    </button>
    <button class="btn" onclick="exportXlsx()"
      style="background:#fff;color:#1a73e8;border:1px solid #1a73e8;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600">
      📥 데이터 다운로드
    </button>
    <input type="file" id="anyFile" accept=".csv" multiple style="display:none" onchange="handleFiles(this.files);this.value=''">
    <span id="uploadStatus" style="font-size:12px;color:#8B95A1"></span>
  </div>
  <!-- Drop zone -->
  <div id="dropZone"
    style="border:2px dashed #D1D6DB;border-radius:14px;padding:32px 16px;text-align:center;
    background:#FAFBFC;transition:border-color .2s,background .2s;cursor:pointer;margin-top:12px"
    onclick="document.getElementById('anyFile').click()">
    <div style="font-size:15px;font-weight:600;color:#333;margin-bottom:4px">📁 CSV 파일 업로드</div>
    <div style="font-size:12px;color:#8B95A1">판매 CSV · SKU 관리 CSV · 통합 SKU관리 CSV(브랜드·SKU ID·SKU명·비고) 자동 인식</div>

    <div class="main-tab" onclick="mainTab('insight')">브랜드 인사이트</div>
    <div class="main-tab" onclick="mainTab('skuManage')">SKU 관리</div>
  </div>

  <div class="main-panel active" id="pDash">
    <div class="dash-inner">
      <div id="dashContent"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="stitle" style="margin:0">일별 판매량</div>
        </div>

    <div style="padding:24px" id="skuManageContent"></div>

</div>

<script>
var D = null;
var CTRL = { threshold:30, minSales:5, period:7, topCount:10 };

// ★ 전역 브랜드 테마 (한 번만 정의)
var bTheme={
  '건우코리아':{color:'#F04452',light:'#FEECEE',grad:'linear-gradient(135deg,#FEECEE 0%,#fff 60%)'},
  '아리코':    {color:'#3182F6',light:'#EBF3FE',grad:'linear-gradient(135deg,#EBF3FE 0%,#fff 60%)'},
  '윰':       {color:'#00B493',light:'#E8FAF6',grad:'linear-gradient(135deg,#E8FAF6 0%,#fff 60%)'}
};
var defaultTheme={color:'#6B7684',light:'#F2F3F5',grad:'linear-gradient(135deg,#F2F3F5 0%,#fff 60%)'};

var BRAND_ORDER = ['아리코','윰','건우코리아'];
function orderedBrands(obj){
  obj = obj || {};
  var arr = BRAND_ORDER.filter(function(b){ return obj[b]; });
  Object.keys(obj).forEach(function(b){ if(arr.indexOf(b)===-1) arr.push(b); });
  return arr;
}


document.getElementById('dateD').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
loadAll();

function mainTab(id){
  document.querySelectorAll('.main-tab').forEach(function(t,i){
    t.classList.toggle('active',(id==='dash'&&i===0)||(id==='insight'&&i===1)||(id==='skuManage'&&i===2));
  });
  document.getElementById('pDash').classList.toggle('active',id==='dash');
  document.getElementById('pInsight').classList.toggle('active',id==='insight');
  document.getElementById('pSkuManage').classList.toggle('active',id==='skuManage');
  if(id==='skuManage') renderSkuManage();
}

/** fetch 응답 본문을 JSON으로 파싱; 실패 시 원인 추적 가능한 메시지 */
function jsonFromResponse(resp, body, label){
  try {
    return JSON.parse(body);
  } catch (err) {
    var raw = body || '';
    var prev = raw.slice(0, 140).replace(/\s+/g, ' ');
    var hint = raw.trim().charAt(0) === '<'
      ? ' HTML이 반환됐습니다(404·오류 페이지·로그인 차단 등). API 경로와 배포를 확인하세요.'
      : (!raw.trim() ? ' 빈 응답입니다.' : '');
    throw new Error((label || 'API') + ': HTTP ' + resp.status + '.' + hint + (prev ? ' 앞부분: ' + prev : ''));
  }
}

async function loadAll(purge){
  setLoading(true);
  try {
    var r = await fetch('/api/dashboard' + (purge ? '?purge=1' : ''));
    var body = await r.text();
    var d = jsonFromResponse(r, body, '/api/dashboard');
    if(!r.ok) throw new Error(d.error || '대시보드 로드 실패');
    D = d || {};
    renderDash();
    renderTrend();
    /* 인사이트는 DOM이 큼 — 대시보드·트렌드 먼저 그린 뒤 다음 틱에 그려 첫 화면이 빨리 보이게 함 */
    requestAnimationFrame(function () {
      setTimeout(function () {
        renderInsight();
        if (document.getElementById('pSkuManage').classList.contains('active')) {
          renderSkuManage();
        }
      }, 0);
    });
    log('');
  } catch (e) {
    log('❌ 데이터 로드 오류: '+e.message, true);
  } finally {
    setLoading(false);
  }
}

function renderDash(){
  if(!D||!D.brands) return;
  var h='<div class="dash-grid">';
  var brandNames=orderedBrands(D.brands);

  for(var i=0;i<brandNames.length;i++){
    var b=brandNames[i];
    var info=D.brands[b];
    var t=bTheme[b]||defaultTheme;
    var gid=(D.sheetGids&&D.sheetGids[b])||'0';

    var todaySales=parseInt(info.todaySales)||0;
    var s7=parseInt(info.sum7)||0;
    var avg7=s7>0?(s7/7).toFixed(1):'0';
    var skuCount=parseInt(info.skuCount)||0;
    var stockSum=parseInt(info.stockSum)||0;
    var oosCount=parseInt(info.outOfStockCount)||0;

    h+='<div class="brand-tile">';

    h+='<div class="bt-hero" style="background:'+t.grad+';color:'+t.color+'">';
    h+='<div class="bt-hero-top">';
    h+='<h3><span class="brand-dot" style="background:'+t.color+'"></span>'+esc(b)+'</h3>';
    h+='<div class="brand-actions">';
    h+='<a class="act-insight" href="javascript:void(0)" onclick="mainTab(\'insight\');goInsight(\''+esc(b)+'\')" title="인사이트">💡</a>';
    h+='</div></div>';

    h+='<div class="bt-big">';
    h+='<div class="bt-big-label">오늘 판매</div>';
    h+='<div class="bt-big-val" style="color:'+t.color+'">'+todaySales.toLocaleString('ko-KR')+'</div>';
    h+='</div></div>';

    h+='<div class="bt-duo">';
    h+='<div class="bt-duo-item"><span class="bt-duo-label">7일 합계</span><span class="bt-duo-val">'+s7.toLocaleString('ko-KR')+'</span></div>';
    h+='<div class="bt-duo-item"><span class="bt-duo-label">7일 일평균</span><span class="bt-duo-val" style="color:'+t.color+'">'+Number(avg7).toLocaleString('ko-KR')+'</span></div>';
    h+='</div>';

    h+='<div class="bt-badges">';
    h+='<div class="bt-badge"><span class="bt-badge-label">SKU</span><span class="bt-badge-val">'+skuCount.toLocaleString('ko-KR')+'</span></div>';
    h+='<div class="bt-badge"><span class="bt-badge-label">재고</span><span class="bt-badge-val">'+stockSum.toLocaleString('ko-KR')+'</span></div>';
    h+='<div class="bt-badge"><span class="bt-badge-label">품절</span><span class="bt-badge-val'+(oosCount>0?' red':'')+'">'+oosCount.toLocaleString('ko-KR')+'</span></div>';
    h+='</div>';

    h+='</div>';
  }
  h+='</div>';

  document.getElementById('dashContent').innerHTML=h;
}

function renderTrend(){
  if(!D||!D.dates||!D.dates.length) return;
  var brands = orderedBrands(D.brands||{});
  var dt = D.dailyTrend || {};
  var dn = ['일','월','화','수','목','금','토'];
  var tTheme = brands.map(function(b){
    var t = bTheme[b] || defaultTheme;
    return {bg:t.light, hd:t.color, tx:t.color, sub:t.light, accent:t.color};
  });
  function bt(i){ return tTheme[i] || {bg:'#f5f5f5',hd:'#888',tx:'#888',sub:'#eee',accent:'#888'}; }



  function fmtD(d){return d.toISOString().slice(0,10);}
  function addD(iso,n){var x=new Date(iso+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return fmtD(x);}
  function dayOfWeek(iso){return new Date(iso+'T12:00:00Z').getUTCDay();}
  function val(b,d){return (dt[b]&&dt[b][d])?Number(dt[b][d]):0;}
  function bt(i){return tTheme[i] || {bg:'#f5f5f5',hd:'#888',tx:'#888',sub:'#eee',accent:'#888'};}
  function fmtDate(d){var p=d.split('-');if(p.length===3)return p[0].substring(2)+'.'+p[1]+'.'+p[2];return d;}
  function fmtRange(d1,d2){return fmtDate(d2)+' ~ '+fmtDate(d1);}

  var today = D.latestDate || D.dates[D.dates.length-1];
  var cutoff30 = addD(today, -30);
  var cutoff = cutoff30;
  var todayDow = dayOfWeek(today);
  var thisWeekSun = addD(today, -todayDow);
  var prev1Sun = addD(thisWeekSun, -7);
  var prev2Sun = addD(thisWeekSun, -14);
  var prev3Sun = addD(thisWeekSun, -21);

  function weekDays(startSun, endDate){
    var arr=[], cur=startSun;
    for(var i=0;i<7;i++){
      if(cur>endDate) break;
      arr.push(cur);
      cur=addD(cur,1);
    }
    return arr;
  }

  var thisWeekDays = weekDays(thisWeekSun, today);
  var prev1Days = weekDays(prev1Sun, addD(thisWeekSun,-1));
  var prev2Days = weekDays(prev2Sun, addD(prev1Sun,-1));
  var prev3Days = weekDays(prev3Sun, addD(prev2Sun,-1));

  var colgroup = '<colgroup>'
    + '<col style="width:140px">'
    + '<col style="width:50px">';
  for(var ci=0; ci<brands.length; ci++){
    colgroup += '<col>';
  }
  colgroup += '<col>';
  colgroup += '</colgroup>';

  var hd='<thead><tr>';
  hd+='<th style="background:#f8f9fa;text-align:center;min-width:64px;border-right:1px solid #e8eaed">날짜</th>';
  hd+='<th style="background:#f8f9fa;text-align:center;min-width:32px;border-right:1px solid #e8eaed">요일</th>';
  brands.forEach(function(b,i){
    var t=bt(i);
    hd+='<th style="background:'+t.hd+';color:#fff;text-align:center;font-size:13px;font-weight:700;padding:10px 16px;border-left:1px solid rgba(255,255,255,.3)">'+esc(b)+'</th>';
  });
  hd+='<th style="background:#202124;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:10px 16px;border-left:1px solid #444">합계</th>';
  hd+='</tr></thead>';

  var bd='<tbody>';

  function renderWeekBlock(days, label){
    var sums={}, total=0, count=days.length;
    brands.forEach(function(b){sums[b]=0;});

    for(var i=days.length-1;i>=0;i--){
      var d=days[i], dw=dn[dayOfWeek(d)], rt=0;
      var isWeekend = dayOfWeek(d)===0||dayOfWeek(d)===6;
      bd+='<tr>';
      bd+='<td style="text-align:center;font-weight:600;color:#202124;border-right:1px solid #f1f3f4;padding:8px 10px">'+fmtDate(d)+'</td>';
      bd+='<td style="text-align:center;border-right:1px solid #f1f3f4;color:'+(dayOfWeek(d)===0?'#ea4335':dayOfWeek(d)===6?'#1a73e8':'#5f6368')+';font-weight:'+(isWeekend?'600':'400')+'">'+dw+'</td>';
      brands.forEach(function(b,bi){
        var v=val(b,d), t=bt(bi);
        if(v===0){
          bd+='<td style="text-align:center;color:#d0d0d0;border-left:1px solid #f1f3f4;padding:8px 10px">-</td>';
        }else{
          bd+='<td style="text-align:center;font-weight:600;color:'+t.tx+';border-left:1px solid #f1f3f4;padding:8px 10px">'+num(v)+'</td>';
        }
        rt+=v; sums[b]+=v;
      });
      var totColor = rt===0?'#d0d0d0':'#202124';
      bd+='<td style="text-align:center;font-weight:700;color:'+totColor+';border-left:1px solid #e8eaed;background:#fafafa;padding:8px 10px">'+(rt===0?'-':num(rt))+'</td></tr>';
      total+=rt;
    }

    bd+='<tr style="border-top:2px solid #1a73e8;border-bottom:2px solid #1a73e8">';
    bd+='<td colspan="2" style="text-align:left;font-weight:700;color:#1a73e8;padding:10px 12px;background:#e8f0fe;border-right:1px solid #c5d8f0">'+label+' ('+count+'일)</td>';
    brands.forEach(function(b,bi){
      var t=bt(bi);
      var avg = count>0 ? Math.round(sums[b]/count) : 0;
      bd+='<td style="text-align:center;padding:6px 8px;background:'+t.bg+';border-left:1px solid '+t.sub+'">'
        +'<div style="font-weight:700;font-size:14px;color:'+t.accent+'">'+num(sums[b])+'</div>'
        +'<div style="font-size:10px;color:'+t.tx+';font-weight:500;margin-top:2px">일평균 '+num(avg)+'</div>'
        +'</td>';
    });
    var avgTotal = count>0 ? Math.round(total/count) : 0;
    bd+='<td style="text-align:center;padding:6px 8px;background:#f0f0f0;border-left:1px solid #ddd">'
      +'<div style="font-weight:700;font-size:14px;color:#202124">'+num(total)+'</div>'
      +'<div style="font-size:10px;color:#5f6368;font-weight:500;margin-top:2px">일평균 '+num(avgTotal)+'</div>'
      +'</td></tr>';
  }

  // 최근 30일을 주 단위로 분할하여 일별 표시
  var monthDays = (D.dates||[]).filter(function(d){ return d >= cutoff30 && d <= today; }).sort();
  var monthWeeks = [];
  var tw = [];
  for(var mi=0; mi<monthDays.length; mi++){
    tw.push(monthDays[mi]);
    if(dayOfWeek(monthDays[mi]) === 6 || mi === monthDays.length - 1){
      monthWeeks.push(tw);
      tw = [];
    }
  }
  monthWeeks.reverse();
  for(var mw=0; mw<monthWeeks.length; mw++){
    var wLabel = mw === 0 ? '이번 주' : mw + '주 전';
    renderWeekBlock(monthWeeks[mw], wLabel);
  }

  var olderDates = (D.dates||[]).filter(function(d){return d<cutoff;});
  if(olderDates.length>0){
    var colSpan = 2 + brands.length + 1;
    bd+='<tr><td colspan="'+colSpan+'" style="background:#f8f9fa;text-align:center;font-weight:700;font-size:12px;color:#5f6368;padding:10px;border-top:2px solid #e8eaed">이전 주간 요약</td></tr>';

    var weeks=[], curWeek=null;
    for(var oi=olderDates.length-1;oi>=0;oi--){
      var od=olderDates[oi], odow=dayOfWeek(od);
      if(!curWeek||odow===6){
        if(curWeek) weeks.push(curWeek);
        curWeek={start:od,end:od,days:0,brands:{},total:0};
        brands.forEach(function(b){curWeek.brands[b]=0;});
      }
      curWeek.start=od; curWeek.days++;
      brands.forEach(function(b){
        var vv=val(b,od); curWeek.brands[b]+=vv; curWeek.total+=vv;
      });
    }
    if(curWeek&&curWeek.days>0) weeks.push(curWeek);

    bd+='<tr>';
    bd+='<th style="background:#f1f3f4;text-align:center;border-right:1px solid #e8eaed">기간</th>';
    bd+='<th style="background:#f1f3f4;text-align:center;border-right:1px solid #e8eaed">일수</th>';
    brands.forEach(function(b,i){
      var t=bt(i);
      bd+='<th style="background:'+t.sub+';text-align:center;border-left:1px solid #e8eaed;color:'+t.tx+';font-weight:700">'+esc(b)+'</th>';
    });
    bd+='<th style="background:#e8eaed;text-align:center;border-left:1px solid #ddd">합계</th></tr>';

    for(var w=0;w<weeks.length;w++){
      var wk=weeks[w], wkAvg=wk.days>0?Math.round(wk.total/wk.days):0;
      bd+='<tr>';
      bd+='<td style="text-align:center;font-weight:600;border-right:1px solid #f1f3f4;padding:8px">'+fmtRange(wk.start,wk.end)+'</td>';
      bd+='<td style="text-align:center;color:#5f6368;border-right:1px solid #f1f3f4">'+wk.days+'일</td>';
      brands.forEach(function(b,bi){
        var t=bt(bi);
        var bAvg = wk.days>0?Math.round(wk.brands[b]/wk.days):0;
        bd+='<td style="text-align:center;padding:6px 8px;border-left:1px solid #f1f3f4">'
          +'<div style="font-weight:600;color:'+t.tx+'">'+num(wk.brands[b])+'</div>'
          +'<div style="font-size:10px;color:#9aa0a6;margin-top:1px">일 '+num(bAvg)+'</div>'
          +'</td>';
      });
      bd+='<td style="text-align:center;padding:6px 8px;border-left:1px solid #e8eaed">'
        +'<div style="font-weight:700">'+num(wk.total)+'</div>'
        +'<div style="font-size:10px;color:#1a73e8;font-weight:600;margin-top:1px">일 '+num(wkAvg)+'</div>'
        +'</td></tr>';
    }
  }

  bd+='</tbody>';
  document.getElementById('tTrend').innerHTML = colgroup+hd+bd;
}


function renderInsight(){
  var tabsEl=document.getElementById('bTabs');
  var contEl=document.getElementById('bContents');
  var brands=orderedBrands((D&&D.brands)||{});
  if(!brands.length){tabsEl.innerHTML='';contEl.innerHTML='<div class="empty" style="padding:20px">데이터가 없습니다.</div>';return;}

  var iTheme = brands.map(function(b){
    var t = bTheme[b] || defaultTheme;
    return {accent:t.color, bg:t.light, tx:t.color, light:t.light, border:t.light, tabBg:t.light};
  });
  function bt(i){ return iTheme[i] || {accent:'#888',bg:'#f5f5f5',tx:'#888',light:'#f5f5f5',border:'#ddd',tabBg:'#f5f5f5'}; }

  var th='',ch='';

  brands.forEach(function(b,idx){
    var t=bt(idx);

    th+='<div class="brand-tab'+(idx===0?' active':'')+'" style="'+(idx===0?'color:'+t.accent+';border-bottom-color:'+t.accent+';background:'+t.tabBg:'')
      +'" onclick="brandTab(\''+esc(b)+'\',this,'+idx+')" data-idx="'+idx+'">'+esc(b)+'</div>';

    var info=D.brands[b]||{};
    var sumP = getBrandPeriodSum(b, CTRL.period);
    var avgP = CTRL.period>0 ? Math.round(sumP/CTRL.period) : 0;

    ch+='<div class="brand-content'+(idx===0?' active':'')+'" id="bc_'+esc(b)+'" data-idx="'+idx+'">';

    ch+='<div class="brand-hdr"><h2 style="color:'+t.accent+'">'+esc(b)+'</h2></div>';

    ch+='<div class="summary-row">'
      +'<div class="scard" style="border-top:3px solid '+t.accent+'"><div class="sl">오늘 판매</div><div class="sv" style="color:'+t.accent+'">'+num(info.todaySales||0)+'</div></div>'
      +'<div class="scard"><div class="sl" id="sumPeriodLabel_'+esc(b)+'">'+CTRL.period+'일 합계</div><div class="sv" id="sumPeriodVal_'+esc(b)+'">'+num(sumP)+'</div></div>'
      +'<div class="scard"><div class="sl" id="sumAvgLabel_'+esc(b)+'">'+CTRL.period+'일 일평균</div><div class="sv green" id="sumAvgVal_'+esc(b)+'">'+num(avgP)+'</div></div>'
      +'<div class="scard"><div class="sl">SKU</div><div class="sv">'+num(info.skuCount||0)+'</div></div>'
      +'<div class="scard"><div class="sl">재고</div><div class="sv">'+num(info.stockSum||0)+'</div></div>'
      +'<div class="scard"><div class="sl">품절</div><div class="sv red">'+num(info.outOfStockCount||0)+'</div></div>'
      +'</div>';

    // === 품절 알림 (판매 TOP30 내 품절) ===
    var oosData = ((D.brandInsights||{})[b]||{})['7']||{};
    var top30ids = {};
    (oosData.topSales||[]).sort(function(a,c){return (c.sales||0)-(a.sales||0);}).slice(0,30).forEach(function(x){
      top30ids[String(x.sku_id)] = x.sales||0;
    });
    var oosInTop = (oosData.oos||[]).filter(function(x){ return top30ids[String(x.sku_id)] !== undefined; });
    oosInTop.sort(function(a,c){ return (top30ids[String(c.sku_id)]||0) - (top30ids[String(a.sku_id)]||0); });

    if (oosInTop.length > 0) {
      ch+='<div style="margin:8px 0;padding:14px 18px;background:#FFF5F5;border:1px solid #FED7D7;border-radius:10px">'
        +'<div style="font-size:13px;font-weight:700;color:#E53E3E;margin-bottom:8px">⚠️ 주요 품절 알림 — 판매 TOP 30 중 '+oosInTop.length+'개 품절</div>'
        +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
        +'<tr style="background:#FED7D7"><th style="padding:6px 8px;text-align:left">SKU ID</th><th style="padding:6px 8px;text-align:left">상품명</th><th style="padding:6px 8px;text-align:center">7일 판매</th><th style="padding:6px 8px;text-align:center">재고</th><th style="padding:6px 8px;text-align:center">품절 시작</th><th style="padding:6px 8px;text-align:center">상태</th></tr>';
      oosInTop.forEach(function(x){
        var sid = String(x.sku_id);
        var _sm = (D.skuManageMap && D.skuManageMap[sid]);

function recompute(brand){
  if (window._insightData) { recomputeCustom(brand); return; }
  var bi=((D.brandInsights||{})[brand]||{})[String(CTRL.period)]||{topSales:[],oos:[],surgeUp:[],surgeDown:[]};
  var topSales=(bi.topSales||[]).slice().sort(function(a,b){return (b.sales||0)-(a.sales||0)}).slice(0,CTRL.topCount);
  var outOfStock=(bi.oos||[]).slice();
  outOfStock.sort(function(a,b){
    var salesDiff=(Number(b.sales)||0)-(Number(a.sales)||0);
    if(salesDiff!==0) return salesDiff;
    var ad=String(a.oosStartDate||a.oos_start_iso||'9999-12-31');
    var bd=String(b.oosStartDate||b.oos_start_iso||'9999-12-31');
    if(ad<bd) return -1;
    if(ad>bd) return 1;
    return 0;
  });
  var rising=filterSurge(bi.surgeUp||[], true);
  var falling=filterSurge(bi.surgeDown||[], false);
  var grid=document.getElementById('igrid_'+brand);
  if(!grid) return;

  var flagBoxHtml = buildFlagInsight(brand, bi.topSales||[], bi);

  grid.innerHTML=
    mkBox('🏆 판매 TOP '+CTRL.topCount+' ('+CTRL.period+'일)','t-top',topSales,'top',brand)+
    flagBoxHtml+
    mkBox('📈 급상승 (최근'+CTRL.period+'일 vs 이전'+CTRL.period+'일, ≥+'+CTRL.threshold+'%, ≥'+CTRL.minSales+'개)','t-up',rising,'up',brand)+
    mkBox('🚫 품절 ('+outOfStock.length+'건)','t-out',outOfStock,'out',brand)+
    mkBox('📉 급하락 (최근'+CTRL.period+'일 vs 이전'+CTRL.period+'일, ≤-'+CTRL.threshold+'%, 이전≥'+CTRL.minSales+'개)','t-down',falling,'down',brand);
  applyFlagFilter(brand);
  updateSummaryPeriod(brand);
}

function buildFlagInsight(brand, allSkuSales, bi){
  var sm = D.skuManageMap || {};
  var flagged = [];
  for(var id in sm){
    var r = sm[id];
    if(r.brand !== brand || !r.flag) continue;
    flagged.push(r);
  }
  if(!flagged.length) return '';

  var salesMap = {};
  for(var i=0;i<allSkuSales.length;i++){
    salesMap[String(allSkuSales[i].sku_id||allSkuSales[i].id)] = Number(allSkuSales[i].sales||0);
  }

  var prevMap = {};
  var rateMap = {};
  var allLists = [].concat(bi.topSales||[], bi.surgeUp||[], bi.surgeDown||[], bi.oos||[]);
  for(var i=0;i<allLists.length;i++){
    var x = allLists[i];
    var sid = String(x.sku_id||x.id||'');
    if(sid && x.prev != null) prevMap[sid] = Number(x.prev)||0;
    if(sid && x.curAvg != null && !prevMap[sid]) {
    }
  }

  var csEl = document.getElementById('curStart_'+brand);
  var ceEl = document.getElementById('curEnd_'+brand);
  var psEl = document.getElementById('prevStart_'+brand);
  var peEl = document.getElementById('prevEnd_'+brand);
  var curLabel = csEl && ceEl ? csEl.value.substring(5)+' ~ '+ceEl.value.substring(5) : '';
  var prevLabel = psEl && peEl ? psEl.value.substring(5)+' ~ '+peEl.value.substring(5) : '';

  var groups = {};
  for(var i=0;i<flagged.length;i++){
    var f = flagged[i].flag;
    if(!groups[f]) groups[f] = [];
    var sid = String(flagged[i].sku_id);
    var cur = salesMap[sid]||0;
    var prev = prevMap[sid]!=null ? prevMap[sid] : null;
    var rate = (prev != null && prev > 0) ? Math.round((cur - prev) / prev * 100) : (cur > 0 && prev === 0 ? 999 : null);
    groups[f].push({
      sku_id: sid,
      sku_name: flagged[i].sku_name||sid,
      flag: f,
      sales: cur,
      prev: prev,
      rate: rate,
      memo: flagged[i].memo||''
    });
  }

  var flagKeys = Object.keys(groups).sort(function(a,b){
    var sa=0, sb=0;
    groups[a].forEach(function(x){sa+=x.sales});
    groups[b].forEach(function(x){sb+=x.sales});
    return sb-sa;
  });
  flagKeys.forEach(function(f){
    groups[f].sort(function(a,b){return b.sales-a.sales});
  });

  var totalCount = flagged.length;
  var totalCur = 0, totalPrev = 0, hasPrev = false;
  flagged.forEach(function(r){
    var sid = String(r.sku_id);
    totalCur += salesMap[sid]||0;
    if(prevMap[sid] != null){ totalPrev += prevMap[sid]; hasPrev = true; }
  });
  var totalRate = hasPrev && totalPrev > 0 ? Math.round((totalCur - totalPrev) / totalPrev * 100) : null;

  var h = '<div class="i-box"><div class="i-title" style="color:#7C5CFC;background:linear-gradient(90deg,#F3F0FF,#fff);border-left:4px solid #7C5CFC;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">';
  h += '<span>🏷️ 플래그 상품 현황 ('+totalCount+'개 · '+num(totalCur)+'개 판매)</span>';
  if(hasPrev && totalRate != null){
    var rc = totalRate > 0 ? '#10B981' : (totalRate < 0 ? '#F04452' : '#8B95A1');
    var rs = totalRate > 0 ? '+'+totalRate+'%' : totalRate+'%';
    h += '<span style="font-size:12px;font-weight:600;color:'+rc+'">vs 비교 '+rs+' ('+num(totalPrev)+'→'+num(totalCur)+')</span>';
  }
  h += '</div>';

  if(curLabel || prevLabel){
    h += '<div style="display:flex;gap:16px;padding:8px 16px;background:#FAFBFC;border-bottom:1px solid #F2F4F6;font-size:11px;color:#8B95A1">';
    if(curLabel) h += '<span>📊 집계: <strong style="color:#3182F6">'+curLabel+'</strong></span>';
    if(prevLabel) h += '<span>📈 비교: <strong style="color:#F04452">'+prevLabel+'</strong></span>';
    h += '</div>';
  }

  h += '<div style="max-height:500px;overflow-y:auto">';

  h += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<thead><tr style="background:#F8F9FA;border-bottom:2px solid #E5E8EB">';
  h += '<th style="padding:8px 6px;text-align:center;width:32px">#</th>';
  h += '<th style="padding:8px 6px;text-align:left;width:40%">상품명</th>';
  h += '<th style="padding:8px 6px;text-align:right;width:70px;border-left:1px solid #E9EDF2;background:#FBFCFE">집계기간</th>';
  if(hasPrev){
    h += '<th style="padding:8px 6px;text-align:right;width:70px;border-left:1px solid #E9EDF2;background:#FBFCFE">비교기간</th>';
    h += '<th style="padding:8px 6px;text-align:center;width:80px;border-left:1px solid #E9EDF2;background:#FBFCFE">변동률</th>';
  }
  h += '<th style="padding:8px 6px;text-align:center;width:30px"></th>';
  h += '</tr></thead>';

  for(var fi=0;fi<flagKeys.length;fi++){
    var flag = flagKeys[fi];
    var items = groups[flag];
    var groupCur = 0, groupPrev = 0, groupHasPrev = false;
    items.forEach(function(x){ groupCur+=x.sales; if(x.prev!=null){groupPrev+=x.prev; groupHasPrev=true;} });
    var groupRate = groupHasPrev && groupPrev > 0 ? Math.round((groupCur - groupPrev) / groupPrev * 100) : null;

    var fs = (typeof flagStyle!=='undefined' && flagStyle[flag]) || {bg:'#F2F3F5',color:'#6B7684'};

    h += '<tr style="background:#FAFBFC;border-top:2px solid #E5E8EB">';
    h += '<td colspan="2" style="padding:10px 12px">';
    h += '<span style="background:'+fs.bg+';color:'+fs.color+';padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700">'+esc(flag)+'</span>';
    h += ' <span style="font-size:12px;color:#8B95A1;margin-left:6px">'+items.length+'개 SKU</span></td>';
    h += '<td style="padding:10px 8px;text-align:right;font-weight:700;color:#7C5CFC;border-left:1px solid #E9EDF2">'+num(groupCur)+'</td>';
    if(hasPrev){
      h += '<td style="padding:10px 8px;text-align:right;color:#8B95A1;border-left:1px solid #E9EDF2">'+num(groupPrev)+'</td>';
      h += '<td style="padding:10px 8px;text-align:center;border-left:1px solid #E9EDF2">'+fmtFlagRate(groupRate)+'</td>';
    }
    h += '<td></td></tr>';

    var foldId = 'flagFold_'+esc(brand)+'_'+fi;
    for(var i=0;i<items.length;i++){
      var s = items[i];
      var rc = i===0?'g1':i===1?'g2':i===2?'g3':'';
      var _su = (D.skuUrls&&D.skuUrls[s.sku_id])||'';
      if(!_su){ var _sm2 = sm[s.sku_id]; if(_sm2) _su = getSkuUrl(_sm2)||''; }
      var snmHtml = _su
        ? '<a href="'+esc(_su)+'" target="_blank" onclick="event.stopPropagation()" style="color:inherit;text-decoration:underline;text-underline-offset:2px">'+esc(s.sku_name)+'</a>'
        : esc(s.sku_name);

      var bgColor = i % 2 === 0 ? '#fff' : '#FAFBFC';
      var hiddenAttr = i >= CTRL.topCount ? ' class="flagFoldRow '+foldId+'" style="display:none;background:'+bgColor+';border-bottom:1px solid #F2F4F6"' : ' style="background:'+bgColor+';border-bottom:1px solid #F2F4F6"';

      h += '<tr'+hiddenAttr+'>';
      h += '<td style="padding:7px 6px;text-align:center"><span class="rk '+rc+'">'+(i+1)+'</span></td>';
      h += '<td style="padding:7px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" onclick="openFlag(\''+esc(s.sku_id)+'\',\''+esc(s.sku_name)+'\',\''+esc(brand)+'\')">';
      h += snmHtml;
      if(s.memo) h += ' <span class="tag" style="background:#F3F0FF;color:#7C5CFC;font-size:10px">'+esc(s.memo)+'</span>';
      h += '</td>';
      h += '<td style="padding:7px 6px;text-align:right;font-weight:700;color:#333;border-left:1px solid #EEF2F6;background:#FCFDFE">'+num(s.sales)+'</td>';
      if(hasPrev){
        h += '<td style="padding:7px 6px;text-align:right;color:#666;border-left:1px solid #EEF2F6;background:#FCFDFE">'+(s.prev!=null?num(s.prev):'-')+'</td>';
        h += '<td style="padding:7px 6px;text-align:center;border-left:1px solid #EEF2F6;background:#FCFDFE">'+fmtFlagRate(s.rate)+'</td>';
      }
      h += '<td style="padding:4px 2px;text-align:center">';
      h += '<button onclick="event.stopPropagation();removeFlag(\''+esc(s.sku_id)+'\',\''+esc(s.sku_name)+'\',\''+esc(brand)+'\')" title="삭제" style="'
        +'background:none;border:none;cursor:pointer;font-size:13px;color:#D1D6DB;padding:2px;line-height:1'
        +'" onmouseover="this.style.color=\'#F04452\'" onmouseout="this.style.color=\'#D1D6DB\'">✕</button>';
      h += '</td></tr>';
    }

    if(items.length > CTRL.topCount){
      var extraCount = items.length - CTRL.topCount;
      var colSpan = hasPrev ? 6 : 4;
      h += '<tr id="'+foldId+'_toggle"><td colspan="'+colSpan+'" style="text-align:center;padding:8px;cursor:pointer;color:#7C5CFC;font-size:12px;font-weight:600;background:#FAFBFC;border-bottom:1px solid #F2F4F6" onclick="toggleFlagFold(\''+foldId+'\','+extraCount+')">';
      h += '<span id="'+foldId+'_label">▼ 외 '+extraCount+'개 더 보기</span>';
      h += '</td></tr>';
    }
  }

  h += '</table></div></div></div>';
  return h;
}

function fmtFlagRate(rate){
  if(rate == null) return '<span style="color:#8B95A1">-</span>';
  if(rate >= 999) return '<span style="color:#10B981;font-weight:600">NEW</span>';
  if(rate <= -999) return '<span style="color:#EF4444;font-weight:600">소멸</span>';
  var color = rate > 0 ? '#10B981' : (rate < 0 ? '#F04452' : '#8B95A1');
  var prefix = rate > 0 ? '+' : '';
  return '<span style="color:'+color+';font-weight:600">'+prefix+rate+'%</span>';
}

function toggleFlagFold(foldId, count){
  var rows = document.querySelectorAll('.'+foldId);
  var label = document.getElementById(foldId+'_label');
  if(!rows.length) return;
  var isHidden = rows[0].style.display === 'none';
  for(var i=0;i<rows.length;i++){
    rows[i].style.display = isHidden ? '' : 'none';
  }
  if(label){
    label.textContent = isHidden ? '▲ 접기' : '▼ 외 '+count+'개 더 보기';
  }
}

async function removeFlag(skuId, skuName, brand){
  if(!confirm('['+skuId+'] '+skuName+'\n플래그를 제거하시겠습니까?')) return;
  try{
    var r = await fetch('/api/flag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skuId:skuId,skuName:skuName,flag:'',memo:''})});
    var j = await r.json();
    if(!r.ok) throw new Error(j.error||'플래그 제거 실패');
    log('🏷️ 플래그 제거: ['+skuId+']');
    loadAll(true);
  }catch(e){ alert('오류: '+e.message); }
}

function renderFlagManageTable(){
  var wrap = document.getElementById('flagManageTableWrap');
  if(!wrap) return;
  var sm = D.skuManageMap || {};
  var brandF = (document.getElementById('fmBrandFilter')||{}).value||'';
  var flagF = (document.getElementById('fmFlagFilter')||{}).value||'';
  var search = ((document.getElementById('fmSearch')||{}).value||'').toLowerCase();

  var items = [];
  for(var id in sm){
    var r = sm[id];
    if(!r.flag) continue;
    if(brandF && r.brand !== brandF) continue;
    if(flagF && r.flag !== flagF) continue;
    if(search && (String(r.sku_id)+' '+(r.sku_name||'')).toLowerCase().indexOf(search)===-1) continue;
    items.push(r);
  }

  items.sort(function(a,b){
    if(a.brand!==b.brand) return (a.brand||'').localeCompare(b.brand||'');
    if(a.flag!==b.flag) return (a.flag||'').localeCompare(b.flag||'');
    return (a.sku_name||'').localeCompare(b.sku_name||'');
  });

  if(!items.length){

  h += '<div style="overflow-x:auto;border:1px solid #F2F4F6;border-radius:8px">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:13px">';

function fmToggleAll(checked){

function fmUpdateSelection(){
  var checked = document.querySelectorAll('.fm-chk:checked');
  var cnt = checked.length;
  var total = document.querySelectorAll('.fm-chk').length;
  var countEl = document.getElementById('fmSelCount');
  var btn = document.getElementById('fmBulkRemoveBtn');
  var allCb = document.getElementById('fmCheckAll');

  if(countEl) countEl.textContent = cnt > 0 ? cnt+'개 선택' : '';
  if(btn) btn.style.display = cnt > 0 ? '' : 'none';

async function fmBulkRemove(){
  var checked = document.querySelectorAll('.fm-chk:checked');
  if(!checked.length) return;
  if(!confirm(checked.length+'개 상품의 플래그를 일괄 제거하시겠습니까?')) return;

  var promises = [];
  checked.forEach(function(cb){
    promises.push(
      fetch('/api/flag',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({skuId:cb.dataset.sku, skuName:cb.dataset.name, flag:'', memo:''})
      })
    );
  });

  try{
    await Promise.all(promises);
    log('🏷️ '+checked.length+'개 플래그 일괄 제거 완료');
    loadAll(true);
  }catch(e){
    alert('일부 제거 실패: '+e.message);
    loadAll(true);
  }
}

function filterSurge(arr, isUp) {
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var x = arr[i];
    /* API: 기준기간 합계 sales, 비교기간 합계 prev — cur 필드 없음 */
    var prevTot = Number(x.prev != null && x.prev !== '' ? x.prev : 0);
    var curTot = Number(x.sales != null && x.sales !== '' ? x.sales : (x.cur != null ? x.cur : 0));
    var rate = x.rate != null ? x.rate : (prevTot > 0 ? Math.round((curTot - prevTot) / prevTot * 100) : (curTot > 0 ? 999 : 0));
    if (isUp) {
      if (rate >= CTRL.threshold && curTot >= CTRL.minSales) {
        x.rate = rate; out.push(x);
      }
    } else {
      if (rate <= (-CTRL.threshold) && prevTot >= CTRL.minSales) {
        x.rate = rate; out.push(x);
      }
    }
  }
  out.sort(function(a, b) { return isUp ? b.rate - a.rate : a.rate - b.rate; });
  return out.slice(0, CTRL.topCount);
}

function fmtChange(val) {
  if (val == null || val === 0) return '<span style="color:#8B95A1">-</span>';
  if (val >= 999) return '<span style="color:#10B981;font-weight:600">NEW</span>';
  if (val <= -999) return '<span style="color:#EF4444;font-weight:600">중단</span>';
  if (val > 0) return '<span style="color:#10B981;font-weight:600">+' + val + '%</span>';
  return '<span style="color:#EF4444;font-weight:600">' + val + '%</span>';
}

function fmtChangeWithDelta(rate, curVal, prevVal) {
  var delta = Number(curVal || 0) - Number(prevVal || 0);
  var abs = Math.round(delta * 10) / 10;
  var absText = abs > 0 ? ('+' + abs) : String(abs);
  var absColor = abs > 0 ? '#10B981' : (abs < 0 ? '#EF4444' : '#8B95A1');
  var rateText = '';
  if (rate == null || rate === 0) rateText = '0%';
  else if (rate >= 999) rateText = 'NEW';
  else if (rate <= -999) rateText = '중단';
  else rateText = (rate > 0 ? '+' + rate : String(rate)) + '%';
  return '<span style="color:' + absColor + ';font-weight:600">' + absText + '</span>'
    + ' <span style="color:#8B95A1;font-size:11px">(' + rateText + ')</span>';
}

function addDaysStr(dateStr, days) {
  var d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function daysBetweenDateStr(start, end) {
  return Math.round((new Date(end + 'T12:00:00Z') - new Date(start + 'T12:00:00Z')) / 86400000) + 1;
}

function syncPrevRange(brand) {
  var cs = document.getElementById('curStart_' + brand);
  var ce = document.getElementById('curEnd_' + brand);
  if (!cs || !ce || !cs.value || !ce.value) return;
  var days = daysBetweenDateStr(cs.value, ce.value);
  var prevEnd = addDaysStr(cs.value, -1);
  var prevStart = addDaysStr(prevEnd, -(days - 1));
  Object.keys(D.brands || {}).forEach(function(b) {
    var ps = document.getElementById('prevStart_' + b);
    var pe = document.getElementById('prevEnd_' + b);
    if (ps) ps.value = prevStart;
    if (pe) pe.value = prevEnd;
  });
  fetchInsight();
}

function insightPreset(target, brand, days) {
  var today = D.latestDate || new Date().toISOString().slice(0, 10);
  if (target === 'cur') {
    var curEnd = today;
    var curStart = addDaysStr(today, -(days - 1));
    var prevEnd = addDaysStr(curStart, -1);
    var prevStart = addDaysStr(prevEnd, -(days - 1));
    Object.keys(D.brands || {}).forEach(function(b) {
      var cs = document.getElementById('curStart_' + b);
      var ce = document.getElementById('curEnd_' + b);
      var ps = document.getElementById('prevStart_' + b);
      var pe = document.getElementById('prevEnd_' + b);
      if (cs) cs.value = curStart;
      if (ce) ce.value = curEnd;
      if (ps) ps.value = prevStart;
      if (pe) pe.value = prevEnd;
    });
    fetchInsight();
    return;
  }

  if (target === 'prev') {
    var csOne = document.getElementById('curStart_' + brand);
    if (!csOne || !csOne.value) return;
    var prevEndOne = addDaysStr(csOne.value, -1);
    var prevStartOne = addDaysStr(prevEndOne, -(days - 1));
    Object.keys(D.brands || {}).forEach(function(b) {
      var ps2 = document.getElementById('prevStart_' + b);
      var pe2 = document.getElementById('prevEnd_' + b);
      if (ps2) ps2.value = prevStartOne;
      if (pe2) pe2.value = prevEndOne;
    });
    fetchInsight();
  }
}

    var cs2 = document.getElementById('curStart_' + b);
    var ce2 = document.getElementById('curEnd_' + b);
    var ps2 = document.getElementById('prevStart_' + b);
    var pe2 = document.getElementById('prevEnd_' + b);
    if (cs2) cs2.value = cs.value;
    if (ce2) ce2.value = ce.value;
    if (ps2) ps2.value = ps.value;
    if (pe2) pe2.value = pe.value;
  });

  clearTimeout(_insightTimer);
  _insightTimer = setTimeout(function() { fetchInsight(); }, 500);
}

async function fetchInsight() {
  var brandsList = orderedBrands(D.brands || {});
  var firstBrand = brandsList[0];
  if (!firstBrand) return;
  var cs = document.getElementById('curStart_' + firstBrand);
  var ce = document.getElementById('curEnd_' + firstBrand);
  var ps = document.getElementById('prevStart_' + firstBrand);
  var pe = document.getElementById('prevEnd_' + firstBrand);
  if (!cs || !ce || !ps || !pe) return;

  var url = '/api/insight?curStart=' + encodeURIComponent(cs.value) + '&curEnd=' + encodeURIComponent(ce.value)
    + '&prevStart=' + encodeURIComponent(ps.value) + '&prevEnd=' + encodeURIComponent(pe.value);

  setInsightLoading(true);
  try {
    var resp = await fetch(url);
    var body = await resp.text();
    var data = jsonFromResponse(resp, body, '/api/insight');
    if (!data.ok) {
      console.error('insight error', data.error);
      window._insightData = null;
      brandsList.forEach(function(b) { recompute(b); });
      return;
    }

    window._insightData = data.brandInsights;
    brandsList.forEach(function(b) {
      recomputeCustom(b);
    });
  } catch (e) {
    console.error('fetchInsight', e);
    window._insightData = null;
    orderedBrands(D.brands || {}).forEach(function(b) { recompute(b); });
  } finally { setInsightLoading(false); }
}

function recomputeCustom(brand) {
  var bi = (window._insightData || {})[brand] || { topSales: [], surgeUp: [], surgeDown: [], oos: [], newItems: [] };
  var topSales = (bi.topSales || []).slice(0, CTRL.topCount);
  var outOfStock = (bi.oos || []).slice();
  outOfStock.sort(function(a, b) {
    var salesDiff = (Number(b.sales) || 0) - (Number(a.sales) || 0);
    if (salesDiff !== 0) return salesDiff;
    var ad = String(a.oosStartDate || a.oos_start_iso || '9999-12-31');
    var bd = String(b.oosStartDate || b.oos_start_iso || '9999-12-31');
    if (ad < bd) return -1;
    if (ad > bd) return 1;
    return 0;
  });
  var rising = filterSurge(bi.surgeUp || [], true);
  var falling = filterSurge(bi.surgeDown || [], false);
  var newItems = (bi.newItems || []).slice(0, Math.max(5, CTRL.topCount));
  var flagBoxHtml = buildFlagInsight(brand, bi.topSales || [], bi);

  var cs = document.getElementById('curStart_' + brand);
  var ce = document.getElementById('curEnd_' + brand);
  var ps = document.getElementById('prevStart_' + brand);
  var pe = document.getElementById('prevEnd_' + brand);
  var curLabel = cs && ce ? cs.value.substring(5) + '~' + ce.value.substring(5) : '';
  var prevLabel = ps && pe ? ps.value.substring(5) + '~' + pe.value.substring(5) : '';

  var grid = document.getElementById('igrid_' + brand);
  if (!grid) return;
  grid.innerHTML =
    mkNewItemsBox('🆕 신규상품 현황 (등록 3개월 이내)', newItems) +
    mkBox('🏆 판매 TOP ' + CTRL.topCount + ' (' + curLabel + ')', 't-top', topSales, 'top', brand) +
    flagBoxHtml +
    mkBox('📈 급상승 (' + curLabel + ' vs ' + prevLabel + ', ≥+' + CTRL.threshold + '%, ≥' + CTRL.minSales + '개)', 't-up', rising, 'up', brand) +
    mkBox('🚫 품절 (' + outOfStock.length + '건)', 't-out', outOfStock, 'out', brand) +
    mkBox('📉 급하락 (' + curLabel + ' vs ' + prevLabel + ', ≤-' + CTRL.threshold + '%, 이전≥' + CTRL.minSales + '개)', 't-down', falling, 'down', brand);
  applyFlagFilter(brand);
  updateSummaryPeriod(brand);
}

function updateSummaryPeriod(brand){
  var sum, days, label;
  
  if (window._insightData) {
    var cs = document.getElementById('curStart_' + brand);
    var ce = document.getElementById('curEnd_' + brand);
    if (cs && ce && cs.value && ce.value) {
      var dt = (D.dailyTrend && D.dailyTrend[brand]) || {};
      sum = 0; days = 0;
      var allDates = (D.dates || []);
      for (var i = 0; i < allDates.length; i++) {
        if (allDates[i] >= cs.value && allDates[i] <= ce.value) {
          sum += Number(dt[allDates[i]] || 0);
          days++;
        }
      }
      label = cs.value.substring(5) + '~' + ce.value.substring(5);
    } else {
      sum = getBrandPeriodSum(brand, CTRL.period);
      days = CTRL.period;
      label = CTRL.period + '일';
    }
  } else {
    sum = getBrandPeriodSum(brand, CTRL.period);
    days = CTRL.period;
    label = CTRL.period + '일';
  }

  var avg = days > 0 ? Math.round(sum / days) : 0;
  var pl = document.getElementById('sumPeriodLabel_' + brand);
  var pv = document.getElementById('sumPeriodVal_' + brand);
  var al = document.getElementById('sumAvgLabel_' + brand);
  var av = document.getElementById('sumAvgVal_' + brand);
  if (pl) pl.textContent = label + ' 합계';
  if (pv) pv.textContent = num(sum);
  if (al) al.textContent = label + ' 일평균';
  if (av) av.textContent = num(avg);
}

function getBrandPeriodSum(brand, period){
  var dt=(D.dailyTrend&&D.dailyTrend[brand])||{};
  var dates=(D.dates||[]).slice(-period);
  var s=0; for(var i=0;i<dates.length;i++) s+=Number(dt[dates[i]]||0);
  return s;
}

function detectSkuRemarksUnified(text){
  var raw=text.split('\n')[0];
  if(!raw)return false;
  var firstLine=raw.replace(/^\ufeff/,'').toLowerCase();
  var hasBrand=firstLine.indexOf('브랜드')!==-1||firstLine.indexOf('brand')!==-1;
  var hasRemark=firstLine.indexOf('비고')!==-1||firstLine.indexOf('remark')!==-1||firstLine.indexOf('메모')!==-1||firstLine.indexOf('notes')!==-1||firstLine.indexOf('note')!==-1;
  var hasSkuId=firstLine.indexOf('sku id')!==-1||firstLine.indexOf('sku_id')!==-1||firstLine.indexOf('skuid')!==-1;
  return hasBrand&&hasRemark&&hasSkuId;
}

/** 브랜드, SKU ID, SKU 명, 비고 — 비고가 «제외»·«신규» 등 */
function parseSkuRemarksUnifiedCsv(text){
  var lines=text.split('\n').map(function(l){return l.trim()}).filter(Boolean);
  if(lines.length<2)return{excludeItems:[],newItems:[]};
  lines[0]=lines[0].replace(/^\ufeff/,'');

  var headerCols=parseExcludeCsvLine(lines[0]).map(function(c){return c.replace(/^"|"$/g,'').toLowerCase().trim()});
  var idxBrand=-1,idxSkuId=-1,idxSkuName=-1,idxRemark=-1;
  headerCols.forEach(function(c,ci){
    if(c==='브랜드'||c==='brand')idxBrand=ci;
    if(c==='sku id'||c==='sku_id'||c==='skuid')idxSkuId=ci;
    if(c==='sku 명'||c==='sku명'||c==='sku_name'||c==='상품명')idxSkuName=ci;
    if(c==='비고'||c==='remark'||c==='메모'||c==='notes'||c==='note')idxRemark=ci;
  });
  if(idxSkuId===-1||idxRemark===-1)return{excludeItems:[],newItems:[]};

  var excludeItems=[];
  var newItems=[];
  for(var li=1;li<lines.length;li++){
    var cols=parseExcludeCsvLine(lines[li]);
    var skuId=idxSkuId>=0?String(cols[idxSkuId]||'').trim().replace(/^"|"$/g,''):'';
    if(!skuId)continue;
    var skuName=idxSkuName>=0?String(cols[idxSkuName]||'').trim().replace(/^"|"$/g,''):'';
    var brand=idxBrand>=0?String(cols[idxBrand]||'').trim().replace(/^"|"$/g,''):'';
    var remarkNorm=String(cols[idxRemark]||'').replace(/\u00a0/g,' ').trim();
    var kind='';
    if(/^제외$/i.test(remarkNorm)||/^exclude$/i.test(remarkNorm))kind='exclude';
    else if(/^신규$/i.test(remarkNorm)||/^new$/i.test(remarkNorm)||/^신규지정$/i.test(remarkNorm))kind='new';
    else if(remarkNorm.indexOf('제외')===0)kind='exclude';
    else if(remarkNorm.indexOf('신규')===0)kind='new';
    if(kind==='exclude')excludeItems.push({sku_id:skuId,sku_name:skuName,brand:brand});
    else if(kind==='new')newItems.push({sku_id:skuId,sku_name:skuName,brand:brand});
  }
  return{excludeItems:excludeItems,newItems:newItems};
}

/** 월별 아카이브 CSV 헤더 셀 → YYYY-MM. 지원: 21.01 · 21.01월 · 21년 1월 · 2021년 1월 */
function tryParseMonthlyHeader(cell){
  var s=String(cell||'').trim().replace(/^"|"$/g,'');
  var mm=s.match(/^(\d{2})\.(\d{2})월?$/i);
  if(mm)return (2000+parseInt(mm[1],10))+'-'+mm[2];
  var m2=s.match(/^(\d{2})년\s*(\d{1,2})월?$/);
  if(m2){
    var mo=parseInt(m2[2],10);
    var mos=mo<10?'0'+mo:String(mo);
    return (2000+parseInt(m2[1],10))+'-'+mos;
  }
  var m3=s.match(/^(\d{4})년\s*(\d{1,2})월?$/);
  if(m3){
    var mo3=parseInt(m3[2],10);
    var mos3=mo3<10?'0'+mo3:String(mo3);
    return parseInt(m3[1],10)+'-'+mos3;
  }
  return '';
}

function detectCsvType(text){
  var raw0=(text.split('\n')[0]||'').replace(/^\ufeff/,'');
  var firstLine=raw0.toLowerCase();
  var cols = firstLine.split(',').map(function(c){ return c.trim().replace(/^"|"$/g,''); });

  for(var i=0;i<cols.length;i++){
    if(tryParseMonthlyHeader(cols[i])) return 'monthly';
  }

  // 플래그/flag 컬럼이 있으면 sku-manage로 우선 분류
  if(firstLine.indexOf('플래그')!==-1 || firstLine.indexOf('flag')!==-1){
    return 'sku-manage';
  }

  if(detectSkuRemarksUnified(text)){
    return 'sku-remarks';
  }

  if(firstLine.indexOf('신규')!==-1 || firstLine.indexOf('new_product_manual')!==-1){
    return 'deprecated-new-csv';
  }

  if(cols.length <= 4 && (firstLine.indexOf('sku_id')!==-1 || firstLine.indexOf('sku id')!==-1 || firstLine.indexOf('sku 명')!==-1)){
    return 'exclude';
  }

  if(firstLine.indexOf('pid')!==-1 || firstLine.indexOf('iid')!==-1 || firstLine.indexOf('vid')!==-1
    || firstLine.indexOf('비고')!==-1 || firstLine.indexOf('flag')!==-1){
    return 'sku-manage';
  }
  return 'sales';
}

function parseExcludeCsvLine(line){
  var cols=[];
  var inQuote=false;
  var current='';
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){
      inQuote=!inQuote;
    }else if(c===','&&!inQuote){
      cols.push(current.trim());
      current='';
    }else{
      current+=c;
    }
  }
  cols.push(current.trim());
  return cols;
}

function splitCsv(text, maxRows){
  var lines = text.split('\n');
  var header = lines[0];
  var chunks = [];
  var current = [header];
  for(var i=1; i<lines.length; i++){
    if(!lines[i].trim()) continue;
    current.push(lines[i]);
    if(current.length - 1 >= maxRows){
      chunks.push(current.join('\n'));
      current = [header];
    }
  }
  if(current.length > 1) chunks.push(current.join('\n'));
  return chunks;
}

async function handleFiles(files){
  var st=document.getElementById('uploadStatus');
  var total=files.length;
  var salesFiles=[];
  var skuFiles=[];
  var excludeFiles=[];
  var skuRemarksFiles=[];
  var deprecatedNewCsv=[];
  var monthlyFiles=[];

  for(var i=0;i<total;i++){
    var text=await readFileText(files[i]);
    var csvType=detectCsvType(text);
    if(csvType==='monthly'){
      monthlyFiles.push({name:files[i].name, text:text});
    }else if(csvType==='sku-remarks'){
      skuRemarksFiles.push({name:files[i].name, text:text});
    }else if(csvType==='deprecated-new-csv'){
      deprecatedNewCsv.push(files[i].name);
    }else if(csvType==='exclude'){
      excludeFiles.push({name:files[i].name, text:text});
    }else if(csvType==='sku-manage'){
      skuFiles.push({name:files[i].name, text:text});
    }else{
      salesFiles.push({name:files[i].name, text:text});
    }
  }

  var totalRows=0;
  var totalImported=0;
  var totalMonthly=0;
  var step=0;
  var syncBrands={};

  for(var i=0;i<salesFiles.length;i++){
    var f=salesFiles[i];
    var isLastSalesFile=(i===salesFiles.length-1);
    var lineCount=f.text.split('\n').filter(function(l){return l.trim()}).length - 1;

    if(lineCount > 800){
      var chunks=splitCsv(f.text, 800);
      for(var c=0;c<chunks.length;c++){
        var isLast=(c===chunks.length-1)&&isLastSalesFile;
        step++;
        if(st) st.textContent=f.name+' ('+Math.round((c+1)/chunks.length*100)+'%) 업로드 중...';
        try{
          var blob=new Blob([chunks[c]],{type:'text/csv'});
          var fd=new FormData();
          fd.append('file',blob,f.name);
          var url='/api/upload';
          var r=await fetch(url,{method:'POST',body:fd});
          var d=await r.json();
          totalRows+=(d.rows||0);
          if(d.fileBrand) syncBrands[d.fileBrand]=true;
        }catch(e){
          if(st) st.textContent='오류: '+f.name+' 청크'+(c+1)+' - '+e.message;
          return;
        }
      }
    }else{
      step++;
      if(st) st.textContent='업로드 중... '+f.name;
      try{
        var blob=new Blob([f.text],{type:'text/csv'});
        var fd=new FormData();
        fd.append('file',blob,f.name);
        var url='/api/upload';
        var r=await fetch(url,{method:'POST',body:fd});
        var d=await r.json();
        totalRows+=(d.rows||0);
        if(d.fileBrand) syncBrands[d.fileBrand]=true;
      }catch(e){
        if(st) st.textContent='오류: '+f.name+' - '+e.message;
        return;
      }
    }
  }

  for(var i=0;i<skuFiles.length;i++){
    var f=skuFiles[i];
    step++;
    if(st) st.textContent='SKU 등록 중... '+f.name;
    try{
      var blob=new Blob([f.text],{type:'text/csv'});
      var fd=new FormData();
      fd.append('file',blob,f.name);
      var r=await fetch('/api/upload-sku-manage',{method:'POST',body:fd});
      var d=await r.json();
      totalImported+=(d.imported||0);
    }catch(e){
      if(st) st.textContent='오류: '+f.name+' - '+e.message;
      return;
    }
  }

  var totalExcluded=0;
  var totalNewManual=0;

  for(var si=0;si<skuRemarksFiles.length;si++){
    var sf=skuRemarksFiles[si];
    if(st) st.textContent='통합 SKU 관리 CSV 처리 중... '+sf.name;
    try{
      var parsed=parseSkuRemarksUnifiedCsv(sf.text);
      if(parsed.excludeItems&&parsed.excludeItems.length){
        var rex=await fetch('/api/exclude',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(parsed.excludeItems)
        });
        var dex=await rex.json();
        totalExcluded+=(dex.added||0);
      }
      if(parsed.newItems&&parsed.newItems.length){
        var rnm=await fetch('/api/new-product-manual',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(parsed.newItems)
        });
        var dnm=await rnm.json();
        totalNewManual+=(dnm.added||0);
      }
    }catch(e){
      if(st) st.textContent='오류: '+sf.name+' - '+e.message;
      return;
    }
  }

  // 제외 SKU CSV 처리
  for(var i=0;i<excludeFiles.length;i++){
    var f=excludeFiles[i];
    if(st) st.textContent='제외 SKU 등록 중... '+f.name;
    try{
      var lines=f.text.split('\n').map(function(l){return l.trim()}).filter(Boolean);
      if(lines.length<2) continue;

      // 헤더에서 컬럼 위치 자동 매핑
      var headerCols=parseExcludeCsvLine(lines[0]).map(function(c){return c.replace(/^"|"$/g,'').toLowerCase()});
      var idxSkuId=-1, idxSkuName=-1, idxBrand=-1;
      headerCols.forEach(function(c,ci){
        if(c==='sku_id'||c==='sku id'||c==='skuid') idxSkuId=ci;
        if(c==='sku_name'||c==='sku명'||c==='sku 명'||c==='상품명') idxSkuName=ci;
        if(c==='brand'||c==='브랜드') idxBrand=ci;
      });
      var hadHeaderMapping = idxSkuId!==-1;
      if(idxSkuId===-1){
        idxSkuId=0; idxSkuName=1;
      }

      var items=[];
      var startLi = hadHeaderMapping ? 1 : 0;
      for(var li=startLi;li<lines.length;li++){
        var cols=parseExcludeCsvLine(lines[li]);
        var skuId=idxSkuId>=0?cols[idxSkuId]:'';
        if(!skuId) continue;
        items.push({
          sku_id:skuId,
          sku_name:idxSkuName>=0?(cols[idxSkuName]||''):'',
          brand:idxBrand>=0?(cols[idxBrand]||''):''
        });
      }

      if(items.length){
        var r=await fetch('/api/exclude',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(items)
        });
        var d=await r.json();
        totalExcluded+=(d.added||0);
      }
    }catch(e){
      if(st) st.textContent='오류: '+f.name+' - '+e.message;
      return;
    }
  }

  for(var i=0;i<monthlyFiles.length;i++){
    var f=monthlyFiles[i];
    if(st) st.textContent='월별 데이터 업로드 중... '+f.name;
    try{
      var mBrand='';
      if(f.name.indexOf('아리코')>=0) mBrand='아리코';
      else if(f.name.indexOf('윰')>=0) mBrand='윰';
      else if(f.name.indexOf('건우')>=0) mBrand='건우코리아';
      if(!mBrand){ if(st) st.textContent='오류: '+f.name+' - 파일명에 브랜드명 필요'; return; }

      var mLines=f.text.split('\n').map(function(l){return l.trim()}).filter(Boolean);
      var mHeader=parseExcludeCsvLine(mLines[0]);

      var monthCols=[];
      for(var mc=0;mc<mHeader.length;mc++){
        var mh=mHeader[mc].trim().replace(/^"|"$/g,'');
        var monthKey=tryParseMonthlyHeader(mh);
        if(monthKey){
          monthCols.push({index:mc, month:monthKey});
        }
      }

      var mIdIdx=-1,mNameIdx=-1;
      for(var mc=0;mc<mHeader.length;mc++){
        var mh2=mHeader[mc].trim().toLowerCase();
        if(mh2==='sku id'||mh2==='sku_id'||mh2==='skuid') mIdIdx=mc;
        if(mh2==='sku명'||mh2==='sku 명'||mh2==='sku_name'||mh2==='상품명') mNameIdx=mc;
      }
      if(mIdIdx===-1) mIdIdx=0;
      if(mNameIdx===-1) mNameIdx=1;

      var mItems=[];
      for(var li=1;li<mLines.length;li++){
        var mCols=parseExcludeCsvLine(mLines[li]);
        var skuId=(mCols[mIdIdx]||'').trim();
        if(!skuId||!/^\d+$/.test(skuId)) continue;
        var skuName=(mCols[mNameIdx]||'').trim();
        var months={};
        for(var mci=0;mci<monthCols.length;mci++){
          var raw=(mCols[monthCols[mci].index]||'').replace(/,/g,'').trim();
          months[monthCols[mci].month]=parseInt(raw,10)||0;
        }
        mItems.push({sku_id:skuId,sku_name:skuName,months:months});
      }

      var r=await fetch('/api/upload-monthly',{
        method:'POST',
        headers:{'Content-Type':'application/json'},

  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;

}

function getFilteredExcludes() {
  var list = window._excludeList || [];
  var search = (document.getElementById('excludeSearchInput') || {}).value || '';
  search = search.toLowerCase();
  var brand = (document.getElementById('excludeBrandFilter') || {}).value || '';

  return list.filter(function(r) {
    var matchBrand = !brand || r.brand === brand;
    var matchSearch = !search || (r.sku_id + ' ' + (r.sku_name || '')).toLowerCase().indexOf(search) >= 0;
    return matchBrand && matchSearch;
  });
}

  var pageItems = filtered.slice(start, start + EXCLUDE_PAGE_SIZE);

      h += '</tr>';
    });
  }
  h += '</tbody></table></div>';
  var tw = document.getElementById('excludeTableWrap');
  if (tw) tw.innerHTML = h;

  var ph = '';
  if (totalPages > 1) {
    ph += '<button onclick="excludeGoPage(1)" style="' + pgBtnStyle(excludeCurrentPage === 1) + '">&laquo;</button>';
    ph += '<button onclick="excludeGoPage(' + (excludeCurrentPage - 1) + ')" style="' + pgBtnStyle(excludeCurrentPage === 1) + '">&lsaquo;</button>';

    var startPage = Math.max(1, excludeCurrentPage - 2);
    var endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

    for (var p = startPage; p <= endPage; p++) {
      var isActive = p === excludeCurrentPage;
      ph += '<button onclick="excludeGoPage(' + p + ')" style="border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;';
      ph += isActive ? 'background:#1a73e8;color:#fff;font-weight:700' : 'background:#F2F4F6;color:#333';

    }

    ph += '<button onclick="excludeGoPage(' + (excludeCurrentPage + 1) + ')" style="' + pgBtnStyle(excludeCurrentPage === totalPages) + '">&rsaquo;</button>';
    ph += '<button onclick="excludeGoPage(' + totalPages + ')" style="' + pgBtnStyle(excludeCurrentPage === totalPages) + '">&raquo;</button>';

  }
  var pe = document.getElementById('excludePagination');
  if (pe) pe.innerHTML = ph;

async function uploadExcludeCsv(files) {
  if (!files || !files.length) return;
  var file = files[0];
  var text = await file.text();
  var lines = text.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);

  // 첫 줄 헤더 확인
  var header = lines[0].toLowerCase();
  var hasHeader = header.indexOf('sku_id') >= 0 || header.indexOf('sku id') >= 0;
  var dataLines = hasHeader ? lines.slice(1) : lines;

  var items = [];
  dataLines.forEach(function(line) {
    var cols = parseExcludeCsvLine(line).map(function(c) { return c.trim().replace(/^"|"$/g, ''); });
    if (cols[0]) {
      items.push({
        sku_id: cols[0],
        sku_name: cols[1] || ''
      });
    }
  });

  if (!items.length) { alert('유효한 데이터가 없습니다'); return; }
  if (!confirm(items.length + '개 SKU를 제외 목록에 추가하시겠습니까?')) return;

  try {
    var res = await fetch('/api/exclude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items)
    });
    var d = await res.json();
    if (d.ok) { alert(d.added + '개 등록 완료'); renderSkuManage(); }
    else alert('오류: ' + (d.error || ''));
  } catch (e) { alert('오류: ' + e.message); }
}

async function removeExclude(skuId) {
  if (!confirm('SKU ' + skuId + '를 제외 목록에서 해제하시겠습니까?')) return;
  try {

function renderNewManualTable() {
  var filtered = getFilteredNewManual();
  var totalPages = Math.max(1, Math.ceil(filtered.length / NEW_MANUAL_PAGE_SIZE));
  if (newManualCurrentPage > totalPages) newManualCurrentPage = totalPages;

  var start = (newManualCurrentPage - 1) * NEW_MANUAL_PAGE_SIZE;
  var pageItems = filtered.slice(start, start + NEW_MANUAL_PAGE_SIZE);

  var countEl = document.getElementById('newManualCount');
  if (countEl) countEl.innerHTML = '총 <strong>' + filtered.length + '</strong>개 지정';

  var h = '<div style="overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  h += '<thead><tr style="background:#5B21B6;color:#fff">';
  h += '<th style="padding:10px 12px;text-align:center;width:40px"><input type="checkbox" onchange="toggleNewManualAll(this)"></th>';
  h += '<th style="padding:10px 12px;text-align:left">브랜드</th>';
  h += '<th style="padding:10px 12px;text-align:left">SKU ID</th>';
  h += '<th style="padding:10px 12px;text-align:left">SKU명</th>';
  h += '<th style="padding:10px 12px;text-align:center">지정일</th>';
  h += '<th style="padding:10px 12px;text-align:center">삭제</th>';
  h += '</tr></thead><tbody>';

  if (pageItems.length === 0) {
    h += '<tr><td colspan="6" style="padding:40px;text-align:center;color:#8B95A1">지정된 SKU가 없습니다</td></tr>';
  } else {
    pageItems.forEach(function(r, i) {
      h += '<tr style="border-top:1px solid #F2F4F6;background:' + (i % 2 === 0 ? '#fff' : '#FAFBFC') + '">';
      h += '<td style="padding:8px 12px;text-align:center"><input type="checkbox" class="newmanual-chk" value="' + esc(r.sku_id) + '"></td>';
      h += '<td style="padding:8px 12px;font-weight:600">' + esc(r.brand || '-') + '</td>';
      h += '<td style="padding:8px 12px;font-family:monospace">' + esc(r.sku_id) + '</td>';
      h += '<td style="padding:8px 12px">' + esc(r.sku_name || '-') + '</td>';
      h += '<td style="padding:8px 12px;text-align:center;color:#8B95A1">' + (r.added_at ? r.added_at.slice(0, 10) : '-') + '</td>';
      h += '<td style="padding:8px 12px;text-align:center"><button onclick="removeNewManual(\'' + esc(r.sku_id) + '\')" style="background:#7C3AED;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer">삭제</button></td>';
      h += '</tr>';
    });
  }
  h += '</tbody></table></div>';
  var tw = document.getElementById('newManualTableWrap');
  if (tw) tw.innerHTML = h;

  var ph = '';
  if (totalPages > 1) {
    ph += '<button onclick="newManualGoPage(1)" style="' + pgBtnStyle(newManualCurrentPage === 1) + '">&laquo;</button>';
    ph += '<button onclick="newManualGoPage(' + (newManualCurrentPage - 1) + ')" style="' + pgBtnStyle(newManualCurrentPage === 1) + '">&lsaquo;</button>';

    var startPage = Math.max(1, newManualCurrentPage - 2);
    var endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

    for (var p = startPage; p <= endPage; p++) {
      var isActive = p === newManualCurrentPage;
      ph += '<button onclick="newManualGoPage(' + p + ')" style="border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;';
      ph += isActive ? 'background:#7C3AED;color:#fff;font-weight:700' : 'background:#F2F4F6;color:#333';
      ph += '">' + p + '</button>';
    }

    ph += '<button onclick="newManualGoPage(' + (newManualCurrentPage + 1) + ')" style="' + pgBtnStyle(newManualCurrentPage === totalPages) + '">&rsaquo;</button>';
    ph += '<button onclick="newManualGoPage(' + totalPages + ')" style="' + pgBtnStyle(newManualCurrentPage === totalPages) + '">&raquo;</button>';
    ph += '<span style="font-size:12px;color:#8B95A1;margin-left:8px">' + newManualCurrentPage + ' / ' + totalPages + ' 페이지</span>';
  }
  var pe = document.getElementById('newManualPagination');
  if (pe) pe.innerHTML = ph;
}

function newManualGoPage(p) {
  var filtered = getFilteredNewManual();
  var totalPages = Math.max(1, Math.ceil(filtered.length / NEW_MANUAL_PAGE_SIZE));
  newManualCurrentPage = Math.max(1, Math.min(p, totalPages));
  renderNewManualTable();
}

function timeAgo(dateStr){
  var diff = Date.now() - new Date(dateStr).getTime();
  var min = Math.floor(diff/60000);
  if(min<60) return min+'분 전';
  var hr=Math.floor(min/60);
  if(hr<24) return hr+'시간 전';
  var day=Math.floor(hr/24);
  return day+'일 전';
}
